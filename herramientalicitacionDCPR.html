<title>DCPR · Cálculo de monto de licitación</title>

     Cada una tiene un CDN alternativo por si el primero está bloqueado. -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --azul-profundo:#0B2545; --azul-medio:#153F66; --azul-linea:#2C5C8F;
  --rojo:#C8102E; --verde:#1F7A5C; --ambar:#B9790A;
  --fondo:#F4F5F7; --superficie:#FFFFFF; --texto:#1B2130; --texto-sec:#5B6472; --linea:#E3E6EB;
  --sidebar-w:280px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--fondo);color:var(--texto);-webkit-font-smoothing:antialiased;}
h1,h2,h3,.num-display{font-family:'Libre Franklin',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
.app{display:flex;min-height:100vh;}

.sidebar{width:var(--sidebar-w);background:var(--azul-profundo);color:#fff;position:fixed;top:0;left:0;bottom:0;
  display:flex;flex-direction:column;z-index:40;transition:transform .28s ease;
  background-image:linear-gradient(var(--azul-profundo),var(--azul-profundo)),
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 28px);}
.sidebar-head{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);}
.sidebar-head .logo-box{background:#fff;display:inline-block;padding:6px;border-radius:7px;line-height:0;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.sidebar-head .logo-box img{display:block;height:46px;width:auto;}
.sidebar-head h1{font-size:18px;font-weight:800;margin-top:12px;line-height:1.25;}
.sidebar-head .sub{font-size:11.5px;color:#A9BCD6;margin-top:4px;}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 10px;}
.nav-group-label{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:700;letter-spacing:.03em;color:#DCE6F2;padding:16px 10px 6px;border-top:1px solid rgba(255,255,255,.1);margin-top:4px;}
.nav-group-label:first-child{border-top:none;margin-top:0;padding-top:6px;}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:#D6E0EE;
  font-family:'Inter',sans-serif;font-size:12.8px;font-weight:500;padding:8px 10px;border-radius:6px;cursor:pointer;line-height:1.25;}
.nav-item .n{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#6F88AE;min-width:16px;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--azul-medio);color:#fff;box-shadow:inset 3px 0 0 var(--rojo);}
.nav-item.active .n{color:#fff;}
.sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.12);font-size:10.5px;color:#8CA3C4;line-height:1.5;}

.main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:var(--superficie);border-bottom:1px solid var(--linea);padding:16px 28px;display:flex;align-items:center;
  gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
.menu-btn{display:none;background:var(--azul-profundo);color:#fff;border:none;width:36px;height:36px;border-radius:7px;font-size:16px;cursor:pointer;}
.topbar h2{font-size:17px;font-weight:800;color:var(--azul-profundo);}
.topbar .meta{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--azul-profundo);background:#E9EEF4;padding:3px 9px;border-radius:5px;margin-top:5px;letter-spacing:.01em;}
.filters{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;align-items:center;}
.filters select{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;padding:8px 12px;border-radius:7px;
  border:1px solid var(--linea);background:var(--fondo);color:var(--texto);cursor:pointer;}
.badge-periodo{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--azul-profundo);color:#fff;padding:6px 11px;border-radius:6px;}

.content{padding:24px 28px 60px;max-width:1300px;}
.panel{display:none;}
.panel.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.panel-title{margin-bottom:16px;}
.panel-title .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--rojo);letter-spacing:.08em;text-transform:uppercase;}
.panel-title h2{font-size:22px;color:var(--azul-profundo);margin-top:4px;}
.panel-title p{color:var(--texto-sec);font-size:13.2px;margin-top:6px;max-width:680px;}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:var(--superficie);border:1px solid var(--linea);border-radius:10px;padding:14px 16px;border-top:3px solid var(--azul-medio);}
.kpi.rojo{border-top-color:var(--rojo);} .kpi.verde{border-top-color:var(--verde);} .kpi.ambar{border-top-color:var(--ambar);}
.kpi .label{font-size:11px;color:var(--texto-sec);text-transform:uppercase;letter-spacing:.03em;}
.kpi .num-display{font-size:25px;font-weight:800;color:var(--azul-profundo);margin-top:4px;}
.kpi .sub{font-size:11.5px;margin-top:3px;color:var(--texto-sec);}

.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px;}
.card{background:var(--superficie);border:1px solid var(--linea);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
.card h3{font-size:13.5px;color:var(--azul-profundo);margin-bottom:2px;}
.card .card-sub{font-size:11.2px;color:var(--texto-sec);margin-bottom:10px;}
.chart-wrap{position:relative;height:250px;}
.chart-wrap.tall{height:340px;}
.chart-wrap.short{height:190px;}
.chart-fallback{display:flex;align-items:center;justify-content:center;height:100%;text-align:center;font-size:12px;color:var(--texto-sec);padding:14px;line-height:1.5;background:repeating-linear-gradient(45deg,#F7F8FA,#F7F8FA 10px,#F0F2F5 10px,#F0F2F5 20px);border-radius:8px;}
.btn-download{display:inline-flex;align-items:center;gap:7px;background:var(--azul-profundo);color:#fff;border:none;padding:9px 16px;border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;}
.btn-download:hover{background:var(--azul-medio);}
.btn-download.claro{background:#fff;color:var(--azul-profundo);border:1px solid var(--linea);}
.btn-download.peligro{background:#fff;color:var(--rojo);border:1px solid #E8C4CB;}
.btn-mini{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;
  border:1px solid var(--azul-profundo);background:var(--azul-profundo);color:#fff;cursor:pointer;white-space:nowrap;}
.btn-mini:hover{background:var(--azul-medio);}
.btn-download.peligro:hover{background:#FBE6E9;}
.btn-download.claro:hover{background:var(--fondo);}
.btn-download:disabled{opacity:.5;cursor:not-allowed;}

.table-scroll{max-height:460px;overflow:auto;border:1px solid var(--linea);border-radius:8px;}
table{width:100%;border-collapse:collapse;font-size:12.3px;}
thead th{position:sticky;top:0;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--texto-sec);
  padding:8px 9px;border-bottom:2px solid var(--linea);background:var(--superficie);z-index:2;}
tbody td{padding:7px 9px;border-bottom:1px solid var(--linea);}
tbody tr:hover{background:var(--fondo);}
tbody tr.total-row td{font-weight:700;background:#F0F3F7;}
tfoot td{position:sticky;bottom:0;background:#F0F3F7;font-weight:700;padding:8px 9px;border-top:2px solid var(--linea);}
.num{font-family:'IBM Plex Mono',monospace;text-align:right;}
.tag-pill{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;}
.tag-pill.ok{background:#E4F3EC;color:var(--verde);}
.tag-pill.warn{background:#FCEFDA;color:var(--ambar);}
.tag-pill.bad{background:#FBE6E9;color:var(--rojo);}
.note-card{background:#F0F3F7;border-left:3px solid var(--azul-medio);border-radius:6px;padding:12px 14px;font-size:12.8px;color:var(--texto);line-height:1.5;margin-bottom:14px;}
.note-card.alerta{background:#FBE6E9;border-left-color:var(--rojo);}
.note-card.aviso{background:#FCEFDA;border-left-color:var(--ambar);}
.note-card b{color:var(--azul-profundo);}
.cartucho{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--texto-sec);border-top:1px dashed var(--linea);
  margin-top:22px;padding-top:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(11,37,69,.5);z-index:30;}
.overlay.show{display:block;}

/* Mapa, mosaico y relato territorial */
.lede{background:var(--superficie);border:1px solid var(--linea);border-left:4px solid var(--rojo);border-radius:10px;
  padding:16px 20px;font-size:15.5px;line-height:1.55;color:var(--texto);margin-bottom:16px;}
.lede b{color:var(--azul-profundo);}
.grid-mapa{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.mapa-caja{position:relative;height:min(78vh,820px);min-height:460px;background:#F8FAFC;
  border:1px solid var(--linea);border-radius:8px;overflow:hidden;}
.mapa-svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none;}
.mapa-svg.arrastrando{cursor:grabbing;}
.mapa-controles{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:5px;z-index:3;}
.mapa-controles button{width:34px;height:34px;border-radius:7px;border:1px solid var(--linea);background:rgba(255,255,255,.94);
  color:var(--azul-profundo);font-size:15px;font-weight:700;cursor:pointer;line-height:1;padding:0;
  box-shadow:0 1px 3px rgba(11,37,69,.12);}
.mapa-controles button:hover{background:#fff;border-color:var(--azul-medio);}
.mapa-pista{position:absolute;left:12px;bottom:10px;z-index:3;font-family:'IBM Plex Mono',monospace;font-size:10px;
  color:var(--texto-sec);background:rgba(255,255,255,.88);padding:4px 8px;border-radius:5px;}
.comuna-path{cursor:pointer;transition:opacity .15s ease;}
.comuna-path:hover{opacity:.75;}
.mosaico{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px;}
.tesela{border:none;border-radius:8px;padding:11px 12px;text-align:left;cursor:pointer;font-family:'Inter',sans-serif;
  display:flex;flex-direction:column;gap:2px;min-height:82px;justify-content:center;transition:transform .12s ease;}
.tesela:hover{transform:translateY(-2px);}
.tesela.sel{outline:2.5px solid var(--rojo);outline-offset:1px;}
.tesela .t-nombre{font-size:12.5px;font-weight:600;line-height:1.2;}
.tesela .t-monto{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;}
.tesela .t-casos{font-size:10.5px;opacity:.8;}
.leyenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:10.5px;color:var(--texto-sec);
  font-family:'IBM Plex Mono',monospace;}
.ley-item{display:inline-flex;align-items:center;gap:5px;}
.ley-item i{width:15px;height:11px;border-radius:2px;display:inline-block;}
@media (max-width:960px){.grid-mapa{grid-template-columns:1fr;}}

/* Deshacer y estado de guardado */
.btn-exportar{font-family:'Inter',sans-serif;font-size:12.2px;font-weight:600;padding:7px 13px;border-radius:7px;
  border:1px solid var(--azul-profundo);background:var(--azul-profundo);color:#fff;cursor:pointer;}
.btn-exportar:hover:not(:disabled){background:var(--azul-medio);}
.btn-exportar:disabled{opacity:.35;cursor:not-allowed;}
.btn-deshacer{font-family:'Inter',sans-serif;font-size:12.2px;font-weight:600;padding:7px 12px;border-radius:7px;
  border:1px solid var(--linea);background:#fff;color:var(--azul-profundo);cursor:pointer;}
.btn-deshacer:hover:not(:disabled){background:var(--fondo);border-color:var(--azul-medio);}
.btn-deshacer:disabled{opacity:.4;cursor:not-allowed;}
.guardado{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--texto-sec);white-space:nowrap;}
.guardado.error{color:var(--rojo);}

/* Secciones aún no disponibles */
.nav-item.no-disponible{opacity:.45;}
.nav-item.no-disponible:hover{opacity:.7;}
.nav-badge{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--rojo);color:#fff;
  border-radius:9px;padding:1px 7px;}

/* Columnas ancladas en el detalle */
#zonaTabla thead th:nth-child(1),#zonaTabla tbody td:nth-child(1){position:sticky;left:0;z-index:3;
  background:var(--superficie);min-width:46px;max-width:46px;}
#zonaTabla thead th:nth-child(2),#zonaTabla tbody td:nth-child(2){position:sticky;left:46px;z-index:3;background:var(--superficie);
  box-shadow:1px 0 0 var(--linea);}
#zonaTabla thead th:nth-child(1),#zonaTabla thead th:nth-child(2){z-index:5;background:var(--superficie);}
#zonaTabla tbody tr:hover td:nth-child(1),#zonaTabla tbody tr:hover td:nth-child(2){background:var(--fondo);}
#zonaTabla tbody tr.total-row td:nth-child(1){background:#F0F3F7;}

/* Etapas valorizables */
.componentes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;}
.componente{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--linea);border-radius:9px;
  padding:12px 14px;cursor:pointer;background:var(--fondo);}
.componente.activo{background:#EEF3F9;border-color:var(--azul-medio);}
.componente input{margin-top:2px;width:16px;height:16px;accent-color:var(--azul-profundo);cursor:pointer;}
.c-cuerpo{display:flex;flex-direction:column;gap:2px;min-width:0;}
.c-titulo{font-family:'Libre Franklin',sans-serif;font-size:13px;font-weight:700;color:var(--azul-profundo);}
.c-detalle{font-size:11.5px;color:var(--texto-sec);line-height:1.45;}
.detalle-fijo{margin-top:12px;padding-top:12px;border-top:1px dashed var(--linea);}

/* Llamada a la siguiente etapa */
.siguiente{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:#EEF3F9;border:1px solid var(--azul-linea);border-radius:10px;padding:16px 20px;margin-bottom:14px;font-size:13.5px;}
.paso.clicable{cursor:pointer;border-radius:8px;transition:background .12s ease;}
.paso.clicable:hover{background:#F4F7FA;}
.paso.clicable .p-cab h4{text-decoration:underline;text-decoration-color:transparent;}
.paso.clicable:hover .p-cab h4{text-decoration-color:var(--azul-linea);}

/* Resumen del flujo de trabajo */
.flujo{background:var(--superficie);border:1px solid var(--linea);border-radius:10px;padding:18px 20px;margin-bottom:14px;}
.flujo-titulo{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--rojo);margin-bottom:14px;}
.paso{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--linea);}
.paso:first-of-type{border-top:none;padding-top:0;}
.p-num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--azul-profundo);color:#fff;
  font-family:'Libre Franklin',sans-serif;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
.p-cuerpo{flex:1;min-width:0;}
.p-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.p-cab h4{font-family:'Libre Franklin',sans-serif;font-size:13.5px;color:var(--azul-profundo);}
.p-cuerpo p{font-size:12.6px;color:var(--texto-sec);line-height:1.55;margin-top:4px;}
.p-estado{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--texto);background:var(--fondo);
  display:inline-block;padding:3px 9px;border-radius:5px;margin-top:7px;}
ul.campos{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:3px 12px;margin:8px 0 2px;}
ul.campos li{font-size:12.2px;color:var(--texto);padding-left:14px;position:relative;}
ul.campos li::before{content:"·";position:absolute;left:4px;color:var(--rojo);font-weight:700;}
ul.campos .oblig{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--rojo);text-transform:uppercase;letter-spacing:.04em;}

/* Lista desplegable de comunas con factor de acceso */
.desplegable{margin-top:12px;border-top:1px solid var(--linea);padding-top:10px;}
.desplegable summary{cursor:pointer;font-size:12.8px;font-weight:600;color:var(--azul-profundo);list-style:none;
  display:flex;align-items:center;gap:7px;}
.desplegable summary::before{content:"▸";color:var(--rojo);font-size:11px;}
.desplegable[open] summary::before{content:"▾";}
.desplegable summary::-webkit-details-marker{display:none;}
.lista-acceso{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:5px;max-height:420px;overflow:auto;
  border:1px solid var(--linea);border-radius:8px;padding:8px;}
.item-acceso{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.2px;
  padding:5px 8px;border-radius:6px;background:var(--fondo);}

/* Tarjetas compactas */
.mini-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:9px;margin-bottom:14px;}
.mini-kpi{background:var(--fondo);border:1px solid var(--linea);border-radius:8px;padding:9px 12px;border-top:2px solid var(--azul-medio);}
.mini-kpi.verde{border-top-color:var(--verde);}
.mini-kpi.rojo{border-top-color:var(--rojo);background:#FBE6E9;}
.mk-label{font-size:10px;color:var(--texto-sec);text-transform:uppercase;letter-spacing:.03em;line-height:1.3;}
.mk-valor{font-family:'Libre Franklin',sans-serif;font-size:17px;font-weight:800;color:var(--azul-profundo);margin-top:2px;}
.mini-kpi.rojo .mk-valor{color:var(--rojo);}

/* Visto bueno de una alerta */
.alerta-linea{display:inline-flex;align-items:center;gap:5px;margin:1px 6px 1px 0;white-space:nowrap;}
.alerta-linea input.vb{width:14px;height:14px;accent-color:var(--verde);cursor:pointer;margin:0;}
.vb-texto{font-size:10px;color:var(--texto-sec);}
.vb-fijo{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--rojo);text-transform:uppercase;letter-spacing:.03em;}

/* Alertas de financiamiento */
.alertas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:14px;}
.alerta-card{background:var(--superficie);border:1px solid var(--linea);border-left:4px solid var(--ambar);border-radius:10px;padding:14px 16px;}
.alerta-card.alta{border-left-color:var(--rojo);}
.alerta-card .a-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
.alerta-card .a-casos{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--texto-sec);}
.alerta-card h4{font-family:'Libre Franklin',sans-serif;font-size:13.5px;color:var(--azul-profundo);line-height:1.3;}
.alerta-card .a-monto{font-family:'Libre Franklin',sans-serif;font-size:20px;font-weight:800;color:var(--azul-profundo);margin:5px 0 6px;}
.alerta-card p{font-size:11.8px;color:var(--texto-sec);line-height:1.5;}

/* Fórmula del valor unitario */
.formula{background:var(--azul-profundo);color:#DCE6F2;border-radius:10px;padding:15px 18px;margin-bottom:14px;
  display:flex;flex-direction:column;gap:5px;font-size:12.5px;line-height:1.5;}
.formula .f-titulo{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#8CA3C4;margin-bottom:4px;}
.formula b{color:#fff;}
.formula .f-total{margin-top:6px;padding-top:8px;border-top:1px solid rgba(255,255,255,.18);color:#fff;font-weight:600;}

/* Etiquetas dentro del mapa */
.etq{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:600;fill:#1B2130;text-anchor:middle;
  paint-order:stroke;stroke:#FFFFFF;stroke-width:2.4px;stroke-linejoin:round;pointer-events:none;}
.etq.monto{font-family:'IBM Plex Mono',monospace;font-size:8.2px;font-weight:500;}
.etq.clara{fill:#FFFFFF;stroke:rgba(11,37,69,.55);}
.comuna-vacia{pointer-events:none;}

/* Formularios y celdas editables */
.campo{display:flex;flex-direction:column;gap:5px;}
.campo label{font-size:11px;color:var(--texto-sec);text-transform:uppercase;letter-spacing:.03em;}
.fila{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px;}
input[type=text],input[type=number],input[type=date],input[type=file],select.campo-sel,textarea{
  font-family:'Inter',sans-serif;font-size:12.5px;padding:8px 10px;border:1px solid var(--linea);
  border-radius:7px;background:var(--fondo);color:var(--texto);}
textarea{width:100%;min-height:110px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.5;}
td.edit{background:#FFFBEF;}
td.edit select{font-family:'Inter',sans-serif;font-size:11.8px;padding:4px 6px;border:1px solid var(--linea);
  border-radius:5px;background:#fff;color:var(--texto);}
td.edit input.celda-corta{width:86px;text-align:left;font-family:'Inter',sans-serif;}
td.edit input.celda-media{width:132px;text-align:left;font-family:'Inter',sans-serif;}
td.edit input.fecha-txt{width:104px;text-align:center;font-family:'IBM Plex Mono',monospace;}
td.edit input.pesos{width:108px;text-align:right;font-family:'IBM Plex Mono',monospace;}
td.edit input.pesos{width:110px;text-align:right;font-family:'IBM Plex Mono',monospace;}
td.edit input{font-family:'IBM Plex Mono',monospace;font-size:11.8px;text-align:right;width:104px;
  border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:4px;}
td.edit input:hover,td.edit input:focus{border-color:var(--linea);background:#fff;}
td.calc{background:#EEF5F1;font-weight:600;color:var(--verde);}
tr.destacada{background:#EEF3F9;}
.buscador{font-size:12.5px;padding:8px 10px;border:1px solid var(--linea);border-radius:7px;background:var(--fondo);min-width:230px;}

@media (max-width:960px){
  .grid-2,.grid-3{grid-template-columns:1fr;}
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .menu-btn{display:inline-block;}
  .content{padding:18px 14px 50px;}
  .topbar{padding:14px 16px;}
}
@media print{.sidebar,.topbar .filters,.menu-btn,.btn-download{display:none;} .main{margin-left:0;}}

  {id:"financiamiento",n:"C", grupo:"Cálculo",     titulo:"Recursos por fuente"},
  {id:"detalle",       n:"D", grupo:"Cálculo",     titulo:"Detalle y exportación"},
  {id:"mapa",          n:"E", grupo:"Análisis",    titulo:"Mapa comunal"},
  {id:"relato",        n:"F", grupo:"Análisis",    titulo:"Relato territorial"},
  {id:"etapas",        n:"G", grupo:"Parámetros",  titulo:"Etapas y factores"},
  {id:"costos",        n:"H", grupo:"Parámetros",  titulo:"Costos Res. Ex. N° 700"},
  {id:"uf",            n:"I", grupo:"Parámetros",  titulo:"Unidad de Fomento"}
];
/* Secciones que funcionan sin casos cargados. */
var SIN_DATOS_OK = ["datos","etapas","costos","uf"];

/* ------------------------------------------------------------------
   3. UTILIDADES
   ------------------------------------------------------------------ */
function normalizar(t){
  if(t === null || t === undefined) return "";
  return String(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim().toUpperCase();
}
/* Los montos se escriben con puntos de miles: "1.234.567" son 1.234.567 pesos. */
function aPesos(v){
  if(v === null || v === undefined || v === "") return 0;
  if(typeof v === "number") return Math.round(v);
  var t = String(v).replace(/\$/g,"").replace(/\s/g,"").replace(/\./g,"").replace(",",".");
  var n = parseFloat(t);
  return isNaN(n) ? 0 : Math.round(n);
}
/* Campo de texto con el monto formateado, para editar montos en las tablas. */
function campoPesos(attrs, valor){
  /* El campo queda vacío cuando el monto es cero y se selecciona al entrar,
     para que al escribir no quede un 0 adelante. */
  return '<input type="text" inputmode="numeric" class="pesos" ' + attrs +
    ' data-tipo="pesos" onfocus="this.select()" placeholder="0" value="' +
    (valor ? fmt(valor) : "") + '">';
}

/* Campo de fecha en texto: acepta escritura y pegado en dd-mm-aaaa,
   dd/mm/aaaa o aaaa-mm-dd. */
function campoFecha(attrs, valor){
  return '<input type="text" class="fecha-txt" ' + attrs + ' data-tipo="fecha" onfocus="this.select()"' +
    ' placeholder="dd-mm-aaaa" value="' + (valor ? fechaLegible(valor) : "") + '">';
}

function aNumero(v){
  if(v === null || v === undefined || v === "") return 0;
  if(typeof v === "number") return isFinite(v) ? v : 0;
  var s = String(v).replace(/\$/g,"").replace(/\s/g,"");
  if(s.indexOf(",") > -1 && s.indexOf(".") > -1) s = s.replace(/\./g,"").replace(",",".");
  else if(s.indexOf(",") > -1) s = s.replace(",",".");
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function fmt(n){ if(n===null||n===undefined) return "s/i"; return new Intl.NumberFormat('es-CL').format(Math.round(n)); }
function fmtCLP(n){ return "$" + new Intl.NumberFormat('es-CL').format(Math.round(n||0)); }
function fmtUF(n){ return new Intl.NumberFormat('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n); }
function pct(parte, total){ return total ? (Math.round(parte/total*1000)/10).toString().replace(".",",") + "%" : "—"; }
function escapar(t){ return String(t===null||t===undefined?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function aFecha(v){
  if(!v) return null;
  if(v instanceof Date && !isNaN(v.getTime())) return v;
  if(typeof v === "number"){ return new Date(Date.UTC(1899,11,30).valueOf() + v*86400000); }
  var s = String(v).trim();
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
  if(m){
    var a = m[3].length === 2 ? 2000 + parseInt(m[3],10) : parseInt(m[3],10);
    return new Date(a, parseInt(m[2],10)-1, parseInt(m[1],10));
  }
  var d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function claveFecha(v){
  var d = aFecha(v);
  if(!d) return "";
  return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
}
function fechaLegible(v){
  var d = aFecha(v);
  if(!d) return "";
  return ("0"+d.getDate()).slice(-2) + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + d.getFullYear();
}
/* UF del día; si falta, usa el día hábil anterior más cercano. */
function ufDelDia(clave){
  if(!clave) return 0;
  if(estado.uf[clave]) return estado.uf[clave];
  var d = aFecha(clave);
  if(!d) return 0;
  for(var i=1;i<=15;i++){
    var k = claveFecha(new Date(d.getTime() - i*86400000));
    if(estado.uf[k]) return estado.uf[k];
  }
  return 0;
}
function ufResumen(){
  var claves = Object.keys(estado.uf).sort();
  if(!claves.length) return {dias:0, desde:"", hasta:"", valor:0};
  return {dias:claves.length, desde:claves[0], hasta:claves[claves.length-1], valor:estado.uf[claves[claves.length-1]]};
}
/* La tabla de acceso trae los nombres tal como aparecen en la resolución;
   este índice permite consultarla sin importar mayúsculas ni acentos. */
var ACCESO_NORM = null;
function claveRegion(t){ return normalizar(t).replace(/[^A-Z0-9]/g,""); }
function indiceAccesoNorm(){
  if(ACCESO_NORM) return ACCESO_NORM;
  ACCESO_NORM = {};
  for(var r in ACCESO_RES700){
    var nr = claveRegion(r);
    if(!ACCESO_NORM[nr]) ACCESO_NORM[nr] = {};
    for(var c in ACCESO_RES700[r]) ACCESO_NORM[nr][normalizar(c)] = ACCESO_RES700[r][c];
  }
  return ACCESO_NORM;
}
/* Devuelve true, false o undefined (comuna no listada para esa región). */
function accesoDeComuna(comuna, region){
  var t = indiceAccesoNorm()[claveRegion(region || estado.region)];
  return t ? t[normalizar(comuna)] : undefined;
}

/* Índice comuna → región, construido desde la cartografía incorporada.
   Ningún nombre de comuna se repite entre regiones, de modo que el calce es unívoco. */
var COMUNA_REGION = null;
function regionDeComuna(comuna){
  if(!COMUNA_REGION){
    COMUNA_REGION = {};
    for(var r in GEO_COMUNAS)
      GEO_COMUNAS[r].forEach(function(c){ COMUNA_REGION[normalizar(c.n)] = r; });
  }
  return COMUNA_REGION[normalizar(comuna)];
}
/* Región predominante entre las comunas de un conjunto de casos. */
function regionPredominante(casos){
  var conteo = {}, mejor = null;
  casos.forEach(function(c){
    var r = regionDeComuna(c.comuna);
    if(!r) return;
    conteo[r] = (conteo[r] || 0) + 1;
    if(!mejor || conteo[r] > conteo[mejor]) mejor = r;
  });
  return {region:mejor, conteo:conteo};
}

function calzarRegion(texto){
  var t = normalizar(texto).replace(/^REGION (DE |DEL |DE LA )?/,"");
  if(t.length < 3) return null;
  if(t.indexOf("BIO") === 0) return "Biobío";
  if(t.indexOf("HIGGINS") > -1 || t.indexOf("OHIGGINS") > -1 || t.indexOf("O HIGGINS") > -1) return "O'Higgins";
  for(var i=0;i<REGIONES.length;i++){
    var nk = normalizar(REGIONES[i]);
    if(nk === t || nk.indexOf(t) === 0 || t.indexOf(nk) === 0) return REGIONES[i];
  }
  return null;
}

/* ------------------------------------------------------------------
   4. CÁLCULO (fórmulas de la planilla de valorización)
   Etapa técnica  = UF de la región × UF del día de ingreso (redondeada).
   Valorización   = factor superficie + factor acceso + etapa técnica.
   Aporte tercero = saldo SIGFE, con tope en la valorización.
   22 / Fondo 41  = parte no cubierta por el saldo SIGFE.
   Convenio       = valorización completa cuando la fuente es convenio.
   ------------------------------------------------------------------ */
function calcularCaso(c){
  var r = RES700[estado.region] || {tecnica:null, publicacion:0, fijo:0, total:0};
  var comp = estado.componentes;
  var ufDia = ufDelDia(c.fecha);

  /* Cada macroetapa del resuelvo 2° se valoriza con la UF del día de ingreso.
     La inscripción está fijada en 1/2 UTM por el Decreto Exento N° 588 de 1998. */
  var etapa = (comp.tecnica && r.tecnica && ufDia) ? Math.round(r.tecnica * ufDia) : 0;
  var publicacion = (comp.publicacion && r.publicacion && ufDia) ? Math.round(r.publicacion * ufDia) : 0;
  /* Costo fijo: si se declaró un ítem con monto en pesos se usa ese valor;
     si no, se toma el tope de la resolución (4,44 UF) al día del ingreso. */
  var topeFijo = (r.fijo && ufDia) ? Math.round(r.fijo * ufDia) : 0;
  var costoFijo = 0;
  if(comp.fijo) costoFijo = estado.costoFijoMonto > 0 ? Math.round(estado.costoFijoMonto) : topeFijo;
  var inscripcion = (comp.inscripcion && estado.utm) ? Math.round(estado.utm / 2) : 0;
  var costoInicial = ufDia ? Math.round((r.total||0) * ufDia) : 0;

  var superficie, acceso;
  if(estado.modoFactores === "panel"){
    superficie = c.superficiePanel;
    acceso = c.accesoPanel;
  }else{
    var base = (estado.modoFactores === "inicial") ? costoInicial : etapa;
    superficie = c.marcaSuperficie ? Math.round(base * 0.3) : 0;
    acceso = c.marcaAcceso ? Math.round(base * 0.3) : 0;
  }

  var valorizacion = Math.round(superficie + acceso + etapa + publicacion + costoFijo + inscripcion);
  var esConvenio = normalizar(c.fuente).indexOf("CONVENIO") > -1;
  var esSectorial = normalizar(c.fuente).indexOf("SECTORIAL") > -1;
  var saldo = c.saldoSigfe;
  c.sinAporteTercero = (esConvenio || esSectorial);

  /* En convenio y sectorial el financiamiento no proviene del solicitante:
     el saldo SIGFE no se imputa y el caso se carga íntegro a su fuente. */
  var tercero = c.sinAporteTercero ? 0 : (saldo === 0 ? 0 : (saldo > valorizacion ? valorizacion : saldo));
  var convenio = esConvenio ? valorizacion : 0;
  var f41;
  if(esConvenio) f41 = 0;
  else if(esSectorial) f41 = valorizacion;
  else if(saldo === 0) f41 = valorizacion;
  else if(valorizacion === tercero) f41 = 0;
  else f41 = valorizacion - saldo;

  /* Diferencia entre el valor unitario calculado y el monto registrado para el caso.
     Esa parte no tiene respaldo en el panel y debe imputarse a una fuente:
     subtítulo 22 / Fondo 41, convenio, o repartida entre ambos. */
  c.diferencia = (c.montoCaso > 0 && valorizacion > c.montoCaso) ? valorizacion - c.montoCaso : 0;
  c.difAl22 = 0; c.difAConvenio = 0; c.difImputada = 0;
  if(c.diferencia > 0 && c.repartoDif && c.repartoDif !== "auto"){
    var fiscal = f41 + convenio;                       // parte con cargo fiscal del caso
    var dif = Math.min(c.diferencia, fiscal);
    if(dif > 0){
      var p = (c.repartoDif === "convenio") ? 0 :
              (c.repartoDif === "mixto" ? Math.min(100, Math.max(0, c.pctAl22 === undefined ? 50 : c.pctAl22))/100 : 1);
      var a22 = Math.round(dif * p), aConv = dif - a22;
      var resto = fiscal - dif;
      var propF41 = fiscal ? f41/fiscal : 0;
      var r22 = Math.round(resto * propF41), rConv = resto - r22;
      f41 = r22 + a22;
      convenio = rConv + aConv;
      c.difImputada = dif; c.difAl22 = a22; c.difAConvenio = aConv;
    }
  }

  /* Los tres componentes del financiamiento se expresan en pesos enteros.
     Tras redondear, el residuo se ajusta para que la suma cuadre exactamente
     con la valorización del caso. */
  tercero = Math.round(tercero);
  f41 = Math.round(f41);
  convenio = Math.round(convenio);
  var residuo = valorizacion - (tercero + f41 + convenio);
  if(residuo !== 0){
    if(esConvenio) convenio += residuo;
    else if(f41 !== 0) f41 += residuo;
    else if(tercero !== 0) tercero += residuo;
    else f41 += residuo;
  }
  c.difAl22 = Math.round(c.difAl22);
  c.difAConvenio = Math.round(c.difAConvenio);
  c.difImputada = Math.round(c.difImputada);

  c.ufDia = ufDia;
  c.etapa = etapa;
  c.publicacion = publicacion;
  c.costoFijo = costoFijo;
  c.topeCostoFijo = topeFijo;
  c.inscripcion = inscripcion;
  c.costoInicial = costoInicial;
  c.superficie = superficie;
  c.acceso = acceso;
  c.valorizacion = valorizacion;
  c.tercero = tercero;
  c.f41 = f41;
  c.convenio = convenio;
  c.sinUF = (ufDia === 0);
  c.observacion = (c.costoAPagar > 0 && saldo > c.costoAPagar) ? "Saldo SIGFE mayor al valor pagado" : "";
  c.alertas = alertasCaso(c);
  return c;
}
function recalcular(){ estado.casos.forEach(calcularCaso); }

/* Texto trazable del cálculo de un caso: sirve para respaldar el monto
   ante el solicitante, la Unidad de Regularización o una auditoría. */
function memoriaCalculo(c){
  var r = RES700[estado.region] || {};
  if(r.tecnica === null) return "La Res. Ex. N° 700 no fija etapa técnica para " + estado.region + ".";
  if(!c.ufDia) return "Sin UF para el " + fechaLegible(c.fecha) + ": la etapa técnica no pudo calcularse.";
  var partes = [];
  if(c.etapa) partes.push("etapa técnica " + fmtUF(r.tecnica) + " UF = " + fmtCLP(c.etapa));
  if(c.publicacion) partes.push("publicación " + fmtUF(r.publicacion) + " UF = " + fmtCLP(c.publicacion));
  if(c.costoFijo) partes.push("costo fijo" + (estado.costoFijoItem ? " por " + estado.costoFijoItem : "") +
    (estado.costoFijoMonto > 0 ? " (valor declarado)" : " " + fmtUF(r.fijo) + " UF") + " = " + fmtCLP(c.costoFijo));
  if(c.inscripcion) partes.push("inscripción 1/2 UTM = " + fmtCLP(c.inscripcion));
  if(c.superficie) partes.push("factor superficie " + fmtCLP(c.superficie));
  if(c.acceso) partes.push("factor acceso " + fmtCLP(c.acceso));
  var t = "UF del " + fechaLegible(c.fecha) + ": $" + fmtUF(c.ufDia) + ". " +
    partes.join(" + ") + " = " + fmtCLP(c.valorizacion) + ". ";
  t += "Financiamiento: terceros " + fmtCLP(c.tercero) + ", 22/Fondo 41 " + fmtCLP(c.f41) + ", convenio " + fmtCLP(c.convenio) + ".";
  if(c.saldoPanel !== undefined && c.saldoPanel !== c.saldoSigfe)
    t += " Saldo SIGFE tomado de la lista: " + fmtCLP(c.saldoSigfe) + "; el panel registraba " + fmtCLP(c.saldoPanel) + " (referencial).";
  if(c.ingresoManual)
    t += " Caso ingresado manualmente en la herramienta: sus datos no provienen del panel de casos en proceso.";
  if(c.fuentePanel && c.fuente && c.fuentePanel !== c.fuente)
    t += " Fuente tomada de la lista: " + c.fuente + "; el panel registraba " + c.fuentePanel + ".";
  return t;
}

function casosFiltrados(){
  var texto = normalizar(filtro.texto);
  return estado.casos.filter(function(c){
    if(filtro.fuente !== "todas" && c.fuente !== filtro.fuente) return false;
    if(filtro.comuna !== "todas" && c.comuna !== filtro.comuna) return false;
    if(texto && normalizar(c.folio+" "+c.solicitante+" "+c.rut+" "+c.comuna).indexOf(texto) === -1) return false;
    return true;
  });
}
function totales(lista){
  var t = {casos:lista.length, valorizacion:0, tercero:0, f41:0, convenio:0, saldo:0, etapa:0,
           publicacion:0, costoFijo:0, inscripcion:0,
           superficie:0, acceso:0, costoAPagar:0, obs:0, sinSaldo:0, sinUF:0};
  lista.forEach(function(c){
    t.valorizacion += c.valorizacion; t.tercero += c.tercero; t.f41 += c.f41;
    t.convenio += c.convenio; t.saldo += c.saldoSigfe; t.etapa += c.etapa;
    t.superficie += c.superficie; t.acceso += c.acceso; t.costoAPagar += c.costoAPagar;
    t.publicacion += c.publicacion || 0; t.costoFijo += c.costoFijo || 0; t.inscripcion += c.inscripcion || 0;
    if(alertasPendientes(c).length) t.obs++;
    if(c.saldoSigfe === 0) t.sinSaldo++;
    if(c.sinUF) t.sinUF++;
  });
  return t;
}
/* Convenios presentes en un conjunto de casos, ordenados por monto. */
function conveniosDe(lista){
  /* "Municipalidad de Castro" y "MUNICIPALIDAD DE CASTRO" son el mismo convenio:
     se agrupan por nombre normalizado y se muestra la primera forma escrita. */
  var mapa = {};
  lista.forEach(function(c){
    if(!c.convenio) return;
    var nombre = String(c.convenioNombre || "").trim() || "(convenio sin identificar)";
    var clave = normalizar(nombre);
    if(!mapa[clave]) mapa[clave] = {nombre:nombre, casos:0, monto:0};
    mapa[clave].casos++; mapa[clave].monto += c.convenio;
  });
  return Object.keys(mapa).sort(function(a,b){ return mapa[b].monto - mapa[a].monto; })
    .map(function(k){ return {nombre:mapa[k].nombre, clave:k, casos:mapa[k].casos, monto:mapa[k].monto}; });
}

function agrupar(lista, llave){
  var mapa = {};
  lista.forEach(function(c){
    var k = llave(c) || "(sin dato)";
    if(!mapa[k]) mapa[k] = {casos:0, valorizacion:0, tercero:0, f41:0, convenio:0, saldo:0};
    mapa[k].casos++; mapa[k].valorizacion += c.valorizacion; mapa[k].tercero += c.tercero;
    mapa[k].f41 += c.f41; mapa[k].convenio += c.convenio; mapa[k].saldo += c.saldoSigfe;
  });
  return mapa;
}

/* ------------------------------------------------------------------
   5. LECTURA DE DATOS (archivo Excel o pegado desde el panel)
   ------------------------------------------------------------------ */
function buscarHoja(libro, aguja){
  var n = libro.SheetNames, i;
  for(i=0;i<n.length;i++) if(normalizar(n[i]) === normalizar(aguja)) return libro.Sheets[n[i]];
  for(i=0;i<n.length;i++) if(normalizar(n[i]).indexOf(normalizar(aguja)) > -1) return libro.Sheets[n[i]];
  return null;
}

function procesarArchivo(archivo){
  var lector = new FileReader();
  lector.onload = function(e){
    try{
      var libro = XLSX.read(new Uint8Array(e.target.result), {type:"array", cellDates:true});
      estado.nombreArchivo = archivo.name;
      estado.mensajesCarga = [];

      /* Serie UF: si el archivo trae la hoja UF, se carga completa. */
      var hojaUF = buscarHoja(libro, "UF");
      if(hojaUF){
        var filasUF = XLSX.utils.sheet_to_json(hojaUF, {header:1, raw:true});
        var leidos = 0;
        filasUF.forEach(function(f){
          for(var c=0;c<(f||[]).length;c++){
            if(f[c] instanceof Date){
              var v = aNumero(f[c+1]);
              if(v > 0){ estado.uf[claveFecha(f[c])] = v; leidos++; }
              break;
            }
          }
        });
        if(leidos) estado.mensajesCarga.push("Serie UF cargada: " + fmt(leidos) + " días.");
      }

      /* Lista de fuentes de financiamiento válidas, si viene en el archivo. */
      var hojaFin = buscarHoja(libro, "FINANCIAMIENTO");
      if(hojaFin){
        var fuentes = [];
        XLSX.utils.sheet_to_json(hojaFin, {header:1, raw:true}).forEach(function(f){
          (f || []).forEach(function(v){
            if(typeof v !== "string") return;
            var t = v.trim();
            if(!t || normalizar(t).indexOf("FINACIAMIENTO") > -1 || normalizar(t).indexOf("FINANCIAMIENTO") === 0) return;
            if(fuentes.indexOf(t) === -1) fuentes.push(t);
          });
        });
        if(fuentes.length){
          estado.fuentesValidas = fuentes;
          estado.mensajesCarga.push("Fuentes de financiamiento válidas: " + fuentes.length + ".");
        }
      }

      /* Tabla de acceso por comuna, si viene en el archivo. */
      var hojaAcceso = buscarHoja(libro, "Acceso");
      if(hojaAcceso) leerTablaAcceso(XLSX.utils.sheet_to_json(hojaAcceso, {header:1, raw:true}));

      /* Casos: hoja del panel o "PARA VALORIZAR". */
      var hojaCasos = buscarHoja(libro, "PARA VALORIZAR") || libro.Sheets[libro.SheetNames[0]];
      var filas = XLSX.utils.sheet_to_json(hojaCasos, {header:1, raw:true, defval:null});
      detectarRegionEnPlanilla(filas);
      cargarFilas(filas);
    }catch(err){
      estado.mensajesCarga = ["No fue posible leer el archivo: " + err.message];
      render();
    }
  };
  lector.readAsArrayBuffer(archivo);
}

function leerTablaAcceso(filas){
  var region = "", n = 0;
  filas.forEach(function(f){
    var celdas = (f||[]).filter(function(x){ return x !== null && x !== undefined && String(x).trim() !== ""; })
                        .map(function(x){ return String(x).trim(); });
    if(celdas.length === 3){ region = calzarRegion(celdas[0]) || region; celdas = celdas.slice(1); }
    if(celdas.length === 2 && region){
      var v = normalizar(celdas[1]);
      if(v === "SI" || v === "NO"){
        if(!ACCESO_RES700[region]) ACCESO_RES700[region] = {};
        ACCESO_RES700[region][celdas[0]] = (v === "SI");
        ACCESO_NORM = null;
        n++;
      }
    }
  });
  if(n) estado.mensajesCarga.push("Tabla de acceso actualizada: " + n + " comunas.");
}

function detectarRegionEnPlanilla(filas){
  for(var r=0;r<Math.min(filas.length,40);r++){
    var fila = filas[r] || [];
    for(var c=0;c<fila.length;c++){
      if(normalizar(fila[c]).indexOf("SELECCIONE LA REGION") > -1){
        for(var k=c+1;k<fila.length;k++){
          if(fila[k] !== null && String(fila[k]).trim() !== ""){
            var reg = calzarRegion(fila[k]);
            if(reg){ estado.region = reg; estado.mensajesCarga.push("Región detectada en el archivo: " + reg + "."); }
            return;
          }
        }
      }
    }
  }
}

/* Toma una matriz de filas, ubica el encabezado y arma los casos. */
function cargarFilas(filas){
  var filaCab = -1;
  for(var r=0;r<filas.length;r++){
    var t = (filas[r]||[]).map(normalizar).join("|");
    if((t.indexOf("FOLIO") > -1 || t.indexOf("EXPEDIENTE") > -1) &&
       (t.indexOf("FECHA") > -1 || t.indexOf("SOLICITANTE") > -1)){ filaCab = r; break; }
  }
  if(filaCab === -1){
    estado.mensajesCarga.push("No se encontró la fila de encabezados: debe contener el folio o N° de expediente y la fecha de ingreso.");
    render(); return;
  }
  estado.encabezados = (filas[filaCab]||[]).map(function(x){ return x === null || x === undefined ? "" : String(x).replace(/\s+/g," ").trim(); });
  estado.filasCrudas = filas.slice(filaCab+1);
  estado.mapeo = detectarColumnas(estado.encabezados);
  armarCasos();
}

/* Empareja cada campo requerido con una columna del archivo. */
function detectarColumnas(encabezados){
  /* Los títulos del panel usan guion bajo (COSTO_CASO, COSTO_A_PAGAR):
     se tratan como espacios para que calcen con las pistas. */
  var norm = encabezados.map(function(x){ return normalizar(x).replace(/_/g, " ").replace(/\s+/g, " ").trim(); });
  var mapeo = {}, usados = {};
  CAMPOS.forEach(function(campo){
    mapeo[campo.clave] = -1;
    for(var p=0;p<campo.pistas.length && mapeo[campo.clave] === -1;p++){
      for(var i=0;i<norm.length;i++){
        if(!norm[i] || usados[i]) continue;
        var pista = campo.pistas[p].replace(/_/g, " ").replace(/\s+/g, " ").trim();
        if(norm[i].indexOf(pista) > -1){ mapeo[campo.clave] = i; usados[i] = true; break; }
      }
    }
  });
  return mapeo;
}

function armarCasos(){
  var m = estado.mapeo, casos = [];
  var valor = function(fila, clave){ return m[clave] >= 0 ? fila[m[clave]] : null; };
  estado.filasCrudas.forEach(function(f){
    if(!f) return;
    var folio = valor(f,"folio");
    var fecha = valor(f,"fecha");
    if((folio === null || String(folio).trim() === "") && !fecha) return;
    if(!aFecha(fecha)) return;
    var sup = Math.round(aNumero(valor(f,"superficie")));
    var acc = Math.round(aNumero(valor(f,"acceso")));
    casos.push({
      folio: folio === null ? "" : String(folio).trim(),
      solicitante: String(valor(f,"solicitante") || "").trim(),
      rut: String(valor(f,"rut") || "").trim(),
      comuna: String(valor(f,"comuna") || "").trim(),
      fecha: claveFecha(fecha),
      fuente: String(valor(f,"fuente") || "").trim(),
      superficiePanel: sup,
      accesoPanel: acc,
      montoCaso: Math.round(aNumero(valor(f,"montoCaso"))),
      costoAPagar: Math.round(aNumero(valor(f,"costoAPagar"))),
      saldoSigfe: Math.round(aNumero(valor(f,"saldoSigfe"))),
      marcaSuperficie: sup > 0,
      marcaAcceso: acc > 0
    });
  });
  if(estado.destinoCarga === "padron"){
    estado.padron = casos;
    PADRON_INDICE = null;
    estado.padronPendiente = false;
    estado.padronArchivo = estado.nombreArchivo;
    estado.padronFecha = new Date().toISOString();
    estado.mensajesCarga.push("Panel cargado: " + fmt(casos.length) + " expedientes disponibles para consultar." +
      (estado.casos.length ? " Los " + fmt(estado.casos.length) + " casos a licitar en pantalla se mantienen; cargue una lista nueva para reemplazarlos." : ""));
    /* El panel puede ser nacional: no define la región del cálculo,
       que se determina con los casos a licitar. Solo se informa su cobertura. */
    var detP = regionPredominante(casos);
    var regionesPanel = Object.keys(detP.conteo || {});
    if(regionesPanel.length > 1){
      regionesPanel.sort(function(a,b){ return detP.conteo[b] - detP.conteo[a]; });
      estado.mensajesCarga.push("El panel cubre " + regionesPanel.length + " regiones (" +
        regionesPanel.slice(0,4).join(", ") + (regionesPanel.length > 4 ? " y otras" : "") +
        "). La región del cálculo se toma de los casos a licitar, no del panel.");
    }else if(regionesPanel.length === 1 && regionesPanel[0] !== estado.region && !estado.casos.length){
      estado.region = regionesPanel[0];
      estado.mensajesCarga.push("Región determinada a partir de las comunas del panel: " + regionesPanel[0] + ".");
    }
    estado.destinoCarga = "casos";
    recalcular(); guardarLocal(); poblarFiltros(); render();
    return;
  }

  estado.casos = casos;
  estado.saldosCargados = casos.some(function(c){ return c.saldoSigfe > 0; });
  estado.mensajesCarga.push("Casos leídos: " + fmt(casos.length) + ".");

  /* La región se deduce de las comunas de los propios casos: evita valorizar
     un expediente con la UF de la etapa técnica de otra región. */
  var det = regionPredominante(casos);
  if(det.region && estado.regionManual && det.region !== estado.region){
    estado.mensajesCarga.push("Las comunas corresponden a " + det.region +
      " y la región elegida a mano es " + estado.region + ": revise antes de calcular.");
  }else if(det.region){
    var ajenas = casos.filter(function(c){
      var r = regionDeComuna(c.comuna);
      return r && r !== det.region;
    }).length;
    if(det.region !== estado.region){
      estado.region = det.region;
      estado.mensajesCarga.push("Región determinada a partir de las comunas: " + det.region + ".");
    }
    if(ajenas) estado.mensajesCarga.push(ajenas + (ajenas === 1 ? " caso pertenece" : " casos pertenecen") + " a otra región: revíselos en la sección B.");
  }
  filtro = {fuente:"todas", comuna:"todas", texto:""};
  recalcular();
  guardarLocal();
  poblarFiltros();
  render();
}

/* Cambiar la correspondencia de columnas rehace el PANEL, no la selección:
   las filas guardadas son las del panel. Después se refrescan los datos de
   los casos a licitar conservando folio, saldo, fuente y convenio. */
function reconstruirDesdeMapeo(){
  var seleccion = JSON.parse(JSON.stringify(estado.casos));
  estado.destinoCarga = "padron";
  armarCasos();
  estado.destinoCarga = "casos";
  if(!seleccion.length) return;

  var refrescados = 0;
  estado.casos = seleccion.map(function(c){
    var base = buscarEnPadron(c.folio);
    if(!base) return c;
    refrescados++;
    c.solicitante = base.solicitante;
    c.rut = base.rut;
    c.comuna = base.comuna;
    c.fecha = base.fecha;
    c.superficiePanel = base.superficiePanel;
    c.accesoPanel = base.accesoPanel;
    c.montoCaso = base.montoCaso;
    c.costoAPagar = base.costoAPagar;
    c.saldoPanel = base.saldoSigfe;
    c.fuentePanel = base.fuente;
    return c;
  });
  recalcular(); guardarLocal(); poblarFiltros();
  estado.mensajesCarga = ["Correspondencia actualizada: se rehizo el panel de " + fmt(estado.padron.length) +
    " expedientes y se refrescaron los datos de " + fmt(refrescados) + " de los " + fmt(estado.casos.length) +
    " casos a licitar. La selección no cambió."];
  render();
}

/* Lee la lista de casos a licitar: folio (o N° de expediente), saldo SIGFE y
   fuente de financiamiento. Los demás datos se toman del panel cargado. */
function procesarArchivoSeleccion(archivo){
  if(!estado.padron.length){ alert("Cargue primero el panel de casos en proceso."); return; }
  var lector = new FileReader();
  lector.onload = function(e){
    try{
      var libro = XLSX.read(new Uint8Array(e.target.result), {type:"array", cellDates:true});
      var hoja = libro.Sheets[libro.SheetNames[0]];
      var filas = XLSX.utils.sheet_to_json(hoja, {header:1, raw:true, defval:null});

      /* Ubica las columnas por su título; si no hay encabezado, usa las dos primeras. */
      var cFolio = 0, cSaldo = 1, cFuente = -1, cConvenio = -1, inicio = 0;
      for(var r=0;r<Math.min(filas.length,15);r++){
        var fila = (filas[r]||[]).map(normalizar);
        var iF = -1, iS = -1, iU = -1, iC = -1;
        for(var k=0;k<fila.length;k++){
          if(iF === -1 && (fila[k].indexOf("FOLIO") > -1 || fila[k].indexOf("EXPEDIENTE") > -1)) iF = k;
          if(iS === -1 && (fila[k].indexOf("SIGFE") > -1 || fila[k].indexOf("SALDO") > -1)) iS = k;
          if(iU === -1 && (fila[k].indexOf("FINANCIAMIENTO") > -1 || fila[k].indexOf("FUENTE") > -1)) iU = k;
          /* Subcategoría: a qué convenio pertenece el expediente. */
          if(iC === -1 && k !== iU && (fila[k].indexOf("CONVENIO") > -1 || fila[k].indexOf("SUBCATEGORIA") > -1)) iC = k;
        }
        if(iF > -1 && (iS > -1 || iU > -1)){
          cFolio = iF; cSaldo = (iS > -1 ? iS : -1); cFuente = iU; cConvenio = iC; inicio = r+1; break;
        }
      }

      var seleccion = [], sinCoincidencia = [], repetidos = 0, distintos = 0, fuentesDistintas = 0, vistos = {}, rescatados = 0;
      for(var f=inicio;f<filas.length;f++){
        var fila2 = filas[f] || [];
        var folio = fila2[cFolio];
        if(folio === null || folio === undefined || String(folio).trim() === "") continue;
        var clave = normalizar(folio);
        if(clave.indexOf("FOLIO") > -1 || clave.indexOf("EXPEDIENTE") > -1) continue;
        if(vistos[clave]){ repetidos++; continue; }
        vistos[clave] = true;
        var idxP = indicePadron();
        var base = idxP.exacto[clave];
        if(!base){
          base = idxP.suelto[claveFolio(folio)];
          if(base) rescatados++;
        }
        if(!base){
          /* Queda registrado con sus datos, para reintentarlo cuando se
             actualice el panel o se corrija el folio. */
          sinCoincidencia.push({
            folio: String(folio).trim(),
            saldo: (cSaldo > -1) ? Math.round(aNumero(fila2[cSaldo])) : 0,
            fuente: (cFuente > -1) ? String(fila2[cFuente] || "").trim() : "",
            convenio: (cConvenio > -1) ? String(fila2[cConvenio] || "").trim() : "",
            /* Campos que el panel habría aportado y que pueden completarse a mano. */
            solicitante: "", rut: "", comuna: "", fecha: "",
            superficie: 0, acceso: 0, montoCaso: 0, costoAPagar: 0
          });
          continue;
        }
        var caso = JSON.parse(JSON.stringify(base));
        /* El saldo del panel es solo referencial: el valor que rige es el de esta lista. */
        caso.saldoPanel = base.saldoSigfe;
        caso.saldoSigfe = (cSaldo > -1) ? Math.round(aNumero(fila2[cSaldo])) : 0;
        if(caso.saldoPanel > 0 && caso.saldoPanel !== caso.saldoSigfe) distintos++;
        /* La fuente de financiamiento también la fija esta lista. */
        caso.fuentePanel = base.fuente;
        if(cFuente > -1) caso.fuente = String(fila2[cFuente] === null || fila2[cFuente] === undefined ? "" : fila2[cFuente]).trim();
        if(cConvenio > -1) caso.convenioNombre = String(fila2[cConvenio] === null || fila2[cConvenio] === undefined ? "" : fila2[cConvenio]).trim();
        else caso.convenioNombre = caso.convenioNombre || "";
        if(caso.fuentePanel && caso.fuente && caso.fuentePanel !== caso.fuente) fuentesDistintas++;
        seleccion.push(caso);
      }

      if(!seleccion.length){
        estado.foliosSinPanel = sinCoincidencia;
        estado.mensajesCarga = ["Ningún folio de la lista calzó con el panel cargado (" + fmt(sinCoincidencia.length) +
          " folios). Verifique que el panel corresponda al mismo período y a la misma región."];
        render(); return;
      }

      var copiaPrevia = JSON.parse(JSON.stringify(estado.casos));
      registrarCambio("carga de la lista de casos a licitar", function(){ estado.casos = copiaPrevia; });

      /* La región del cálculo se determina con las comunas de los casos
         seleccionados, salvo que el usuario la haya fijado a mano. */
      var detSel = regionPredominante(seleccion);
      var avisoRegion = "";
      if(detSel.region){
        var regionesSel = Object.keys(detSel.conteo);
        if(estado.regionManual && detSel.region !== estado.region){
          avisoRegion = " Atención: las comunas corresponden a " + detSel.region +
            " y la región elegida a mano es " + estado.region + "; revise la sección C.";
        }else if(!estado.regionManual && detSel.region !== estado.region){
          estado.region = detSel.region;
          avisoRegion = " Región del cálculo: " + detSel.region + ", determinada por las comunas de los casos.";
        }
        if(regionesSel.length > 1)
          avisoRegion += " La lista mezcla comunas de " + regionesSel.length + " regiones: los casos ajenos quedan marcados con alerta.";
      }

      estado.casos = seleccion;
      estado.saldosCargados = (cSaldo > -1);
      estado.nombreArchivo = archivo.name;
      filtro = {fuente:"todas", comuna:"todas", texto:""};
      recalcular(); guardarLocal(); poblarFiltros();
      estado.mensajesCarga = ["Casos a licitar cargados desde " + archivo.name + ": " + fmt(seleccion.length) + " expedientes." + avisoRegion +
        (cSaldo > -1
          ? " El saldo SIGFE se tomó de esta lista." +
            (distintos ? " En " + fmt(distintos) + (distintos === 1 ? " caso difiere" : " casos difiere") + " del valor referencial del panel; rige el de la lista." : "")
          : " ATENCIÓN: la lista no traía columna de saldo SIGFE, así que todos los casos quedaron en cero. El saldo del panel no se usa por ser referencial.") +
        (cConvenio > -1 ? " Se identificó el convenio de cada expediente." : "") +
        (cFuente > -1
          ? " La fuente de financiamiento se tomó de la lista." +
            (fuentesDistintas ? " En " + fmt(fuentesDistintas) + (fuentesDistintas === 1 ? " caso difiere" : " casos difiere") + " de la registrada en el panel." : "")
          : " La lista no traía fuente de financiamiento: se conservó la del panel.") +
        (repetidos ? " " + repetidos + " folios repetidos se omitieron." : "") +
        (rescatados ? " " + fmt(rescatados) + (rescatados === 1 ? " folio calzó" : " folios calzaron") + " ignorando ceros o separadores." : "") +
        (sinCoincidencia.length ? " ATENCIÓN: " + fmt(sinCoincidencia.length) +
          (sinCoincidencia.length === 1 ? " folio no está en el panel y quedó fuera del cálculo." : " folios no están en el panel y quedaron fuera del cálculo.") +
          " Revíselos en la tarjeta de folios pendientes." : "")];
      estado.foliosSinPanel = sinCoincidencia;
      render();
    }catch(err){
      estado.mensajesCarga = ["No fue posible leer la lista: " + err.message];
      render();
    }
  };
  lector.readAsArrayBuffer(archivo);
}

/* Índice folio → expediente del panel, calculado una sola vez. */
var PADRON_INDICE = null;
/* Clave tolerante: ignora espacios, guiones, puntos y ceros a la izquierda,
   que son la causa habitual de que un folio no calce entre archivos. */
function claveFolio(v){
  var t = normalizar(v).replace(/[^A-Z0-9]/g,"");
  var soloDigitos = t.replace(/^0+/,"");
  return soloDigitos || t;
}
function indicePadron(){
  if(PADRON_INDICE) return PADRON_INDICE;
  PADRON_INDICE = {exacto:{}, suelto:{}};
  for(var i=0;i<estado.padron.length;i++){
    var x = estado.padron[i];
    PADRON_INDICE.exacto[normalizar(x.folio)] = x;
    var k = claveFolio(x.folio);
    if(!PADRON_INDICE.suelto[k]) PADRON_INDICE.suelto[k] = x;
  }
  return PADRON_INDICE;
}
/* Busca un folio en el panel: primero tal cual, luego con la clave tolerante. */
function buscarEnPadron(folio){
  var idx = indicePadron();
  return idx.exacto[normalizar(folio)] || idx.suelto[claveFolio(folio)] || null;
}

/* Lee el Excel de saldos SIGFE: una columna de folio y otra de monto. */
function procesarArchivoSaldos(archivo){
  if(!estado.casos.length){ alert("Cargue primero los folios del panel de casos en proceso."); return; }
  var lector = new FileReader();
  lector.onload = function(e){
    try{
      var libro = XLSX.read(new Uint8Array(e.target.result), {type:"array", cellDates:true});
      var hoja = libro.Sheets[libro.SheetNames[0]];
      var filas = XLSX.utils.sheet_to_json(hoja, {header:1, raw:true, defval:null});

      /* Ubica el encabezado; si no lo hay, usa las dos primeras columnas. */
      var colFolio = 0, colSaldo = 1, inicio = 0;
      for(var r=0;r<Math.min(filas.length,15);r++){
        var fila = (filas[r]||[]).map(normalizar);
        var iF = -1, iS = -1;
        for(var k=0;k<fila.length;k++){
          if(iF === -1 && fila[k].indexOf("FOLIO") > -1) iF = k;
          if(iS === -1 && (fila[k].indexOf("SIGFE") > -1 || fila[k].indexOf("SALDO") > -1 || fila[k].indexOf("MONTO") > -1)) iS = k;
        }
        if(iF > -1 && iS > -1){ colFolio = iF; colSaldo = iS; inicio = r+1; break; }
      }

      var copia = copiaSaldos();
      registrarCambio("carga de saldos SIGFE desde " + archivo.name, function(){ restaurarSaldos(copia); });
      var indice = {};
      estado.casos.forEach(function(c){ indice[normalizar(c.folio)] = c; });
      var aplicados = 0, sinCoincidencia = [];
      for(var f=inicio;f<filas.length;f++){
        var fila2 = filas[f] || [];
        var folio = fila2[colFolio];
        if(folio === null || folio === undefined || String(folio).trim() === "") continue;
        var clave = normalizar(folio);
        if(clave.indexOf("FOLIO") > -1) continue;
        if(indice[clave]){ indice[clave].saldoSigfe = Math.round(aNumero(fila2[colSaldo])); aplicados++; }
        else sinCoincidencia.push(String(folio).trim());
      }

      if(aplicados) estado.saldosCargados = true;
      recalcular();
      guardarLocal();
      estado.mensajesCarga = ["Saldos SIGFE cargados desde " + archivo.name + ": " + fmt(aplicados) + " casos actualizados." +
        (sinCoincidencia.length ? " Sin coincidencia de folio: " + sinCoincidencia.slice(0,10).join(", ") +
          (sinCoincidencia.length > 10 ? " y " + (sinCoincidencia.length-10) + " más." : ".") : "")];
      render();
    }catch(err){
      estado.mensajesCarga = ["No fue posible leer el archivo de saldos: " + err.message];
      render();
    }
  };
  lector.readAsArrayBuffer(archivo);
}

/* Un pendiente puede valorizarse cuando tiene folio y fecha de ingreso:
   son los dos datos sin los cuales no hay cálculo posible. */
function pendienteCompleto(p){
  return !!(String(p.folio).trim() && p.fecha && aFecha(p.fecha));
}

/* Convierte un pendiente completado a mano en un caso del cálculo. */
function casoDesdePendiente(p){
  return {
    folio: String(p.folio).trim(),
    solicitante: p.solicitante || "",
    rut: p.rut || "",
    comuna: p.comuna || "",
    fecha: claveFecha(p.fecha),
    fuente: p.fuente || "",
    convenioNombre: p.convenio || "",
    superficiePanel: Math.round(aNumero(p.superficie)),
    accesoPanel: Math.round(aNumero(p.acceso)),
    montoCaso: Math.round(aNumero(p.montoCaso)),
    costoAPagar: Math.round(aNumero(p.costoAPagar)),
    saldoSigfe: Math.round(aNumero(p.saldo)),
    marcaSuperficie: aNumero(p.superficie) > 0,
    marcaAcceso: aNumero(p.acceso) > 0,
    ingresoManual: true
  };
}

/* Incorpora al cálculo los pendientes completados. indice = -1 para todos. */
function incorporarPendientes(indice){
  var candidatos = [], quedan = [];
  estado.foliosSinPanel.forEach(function(p, i){
    var elegido = (indice === -1 || indice === i) && pendienteCompleto(p);
    if(elegido) candidatos.push(p); else quedan.push(p);
  });
  if(!candidatos.length){
    alert("Para incorporar un folio hace falta al menos su fecha de ingreso, que es la que determina la UF del cálculo.");
    return;
  }
  var copiaCasos = JSON.parse(JSON.stringify(estado.casos));
  var copiaPend = JSON.parse(JSON.stringify(estado.foliosSinPanel));
  registrarCambio("incorporación manual de " + candidatos.length + (candidatos.length === 1 ? " folio" : " folios"), function(){
    estado.casos = copiaCasos; estado.foliosSinPanel = copiaPend;
  });
  estado.casos = estado.casos.concat(candidatos.map(casoDesdePendiente));
  estado.foliosSinPanel = quedan;
  recalcular(); guardarLocal(); poblarFiltros();
  estado.mensajesCarga = [fmt(candidatos.length) + (candidatos.length === 1 ? " folio completado a mano se incorporó al cálculo." : " folios completados a mano se incorporaron al cálculo.") +
    (quedan.length ? " Quedan " + fmt(quedan.length) + " pendientes." : " No quedan folios pendientes.") +
    " Quedan marcados como ingreso manual en la memoria de cálculo."];
  render();
}

/* Vuelve a buscar en el panel los folios que quedaron pendientes.
   Sirve tras actualizar el panel o corregir un folio. */
function reintentarFolios(){
  if(!estado.foliosSinPanel.length) return;
  if(!estado.padron.length){ alert("Cargue el panel de casos en proceso para reintentar."); return; }
  var recuperados = [], quedan = [];
  estado.foliosSinPanel.forEach(function(p){
    var base = buscarEnPadron(p.folio);
    if(!base){ quedan.push(p); return; }
    var caso = JSON.parse(JSON.stringify(base));
    caso.saldoPanel = base.saldoSigfe;
    caso.saldoSigfe = p.saldo;
    caso.fuentePanel = base.fuente;
    if(p.fuente) caso.fuente = p.fuente;
    caso.convenioNombre = p.convenio || "";
    recuperados.push(caso);
  });
  if(!recuperados.length){
    estado.mensajesCarga = ["Ninguno de los " + fmt(quedan.length) + " folios pendientes está todavía en el panel."];
    render(); return;
  }
  var copiaPrevia = JSON.parse(JSON.stringify(estado.casos));
  var copiaPend = estado.foliosSinPanel.slice();
  registrarCambio("incorporación de folios pendientes", function(){
    estado.casos = copiaPrevia; estado.foliosSinPanel = copiaPend;
  });
  estado.casos = estado.casos.concat(recuperados);
  estado.foliosSinPanel = quedan;
  recalcular(); guardarLocal(); poblarFiltros();
  estado.mensajesCarga = [fmt(recuperados.length) + (recuperados.length === 1 ? " folio se incorporó al cálculo." : " folios se incorporaron al cálculo.") +
    (quedan.length ? " Quedan " + fmt(quedan.length) + " sin coincidencia." : " No quedan folios pendientes.")];
  render();
}

/* Pone en cero todos los saldos SIGFE, para volver a cargarlos. */
function borrarSaldos(){
  var copia = copiaSaldos(), antes = estado.saldosCargados;
  registrarCambio("borrado de los saldos SIGFE", function(){
    restaurarSaldos(copia); estado.saldosCargados = antes;
  });
  estado.casos.forEach(function(c){ c.saldoSigfe = 0; calcularCaso(c); });
  estado.saldosCargados = false;
  guardarLocal();
  estado.mensajesCarga = ["Saldos SIGFE eliminados: " + fmt(estado.casos.length) + " casos quedaron en cero, listos para una nueva carga."];
  render();
}

/* Pegado directo desde el panel (tabulaciones o punto y coma). */
function cargarPegado(texto){
  var lineas = texto.split(/\r?\n/).filter(function(l){ return l.trim() !== ""; });
  if(lineas.length < 2){
    estado.mensajesCarga = ["Pegue al menos la fila de títulos y una fila de datos."];
    render(); return;
  }
  var sep = (lineas[0].indexOf("\t") > -1) ? "\t" : (lineas[0].indexOf(";") > -1 ? ";" : ",");
  var filas = lineas.map(function(l){ return l.split(sep).map(function(x){ return x.trim(); }); });
  estado.nombreArchivo = "Datos pegados desde el panel";
  estado.mensajesCarga = ["Datos pegados: " + (filas.length-1) + " filas."];
  cargarFilas(filas);
}

/* Pegado de saldos SIGFE: folio y monto, separados por tabulación. */
function aplicarSaldos(texto){
  var lineas = texto.split(/\r?\n/).filter(function(l){ return l.trim() !== ""; });
  var indice = {};
  estado.casos.forEach(function(c){ indice[normalizar(c.folio)] = c; });
  estado.saldosCargados = true;
  var aplicados = 0, noEncontrados = [];
  lineas.forEach(function(l){
    var partes = l.split(/\t|;|,/).map(function(x){ return x.trim(); });
    if(partes.length < 2) return;
    var folio = normalizar(partes[0]);
    if(normalizar(partes[0]).indexOf("FOLIO") > -1) return;  // fila de títulos
    if(indice[folio]){ indice[folio].saldoSigfe = Math.round(aNumero(partes[1])); aplicados++; }
    else noEncontrados.push(partes[0]);
  });
  recalcular();
  guardarLocal();
  estado.mensajesCarga = ["Saldos SIGFE aplicados a " + aplicados + " casos." +
    (noEncontrados.length ? " Folios sin coincidencia: " + noEncontrados.slice(0,10).join(", ") +
    (noEncontrados.length > 10 ? " y " + (noEncontrados.length-10) + " más." : ".") : "")];
  render();
}

var ultimoGuardado = null, guardadoConError = false;
function mostrarGuardado(){
  var caja = document.getElementById("guardado");
  if(!caja) return;
  if(guardadoConError){ caja.textContent = "no se pudo guardar en este navegador"; caja.className = "guardado error"; return; }
  caja.className = "guardado";
  if(!ultimoGuardado){ caja.textContent = ""; return; }
  var seg = Math.round((Date.now() - ultimoGuardado)/1000);
  caja.textContent = seg < 10 ? "guardado recién"
    : seg < 60 ? "guardado hace " + seg + " s"
    : seg < 3600 ? "guardado hace " + Math.round(seg/60) + " min"
    : "guardado a las " + new Date(ultimoGuardado).toLocaleTimeString("es-CL", {hour:"2-digit", minute:"2-digit"});
}

function guardarLocal(){
  try{
    localStorage.setItem(CLAVE_LOCAL, JSON.stringify({
      casos:estado.casos, uf:estado.uf, region:estado.region, modoFactores:estado.modoFactores,
      nombreArchivo:estado.nombreArchivo, res700:RES700, utm:estado.utm,

    }));

  }catch(e){ guardadoConError = true; }

function cargarLocal(){
  try{

/* La sesión completa —casos, saldos, UF, parámetros y decisiones de imputación—
   se guarda en un archivo para retomarla en otro equipo o dejarla como respaldo. */
function guardarSesionArchivo(){
  var datos = {
    version: 1, guardado: new Date().toISOString(),
    region: estado.region, modoFactores: estado.modoFactores,
    nombreArchivo: estado.nombreArchivo, res700: RES700, utm: estado.utm,
    componentes: estado.componentes, fuentesValidas: estado.fuentesValidas,
    costoFijoItem: estado.costoFijoItem, costoFijoMonto: estado.costoFijoMonto,
    padron: estado.padron, padronArchivo: estado.padronArchivo, padronFecha: estado.padronFecha,
    saldosCargados: estado.saldosCargados, casos: estado.casos, uf: estado.uf
  };
  var blob = new Blob([JSON.stringify(datos)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var hoy = new Date();
  a.href = url;
  a.download = "Sesion_licitacion_" + estado.region.replace(/[^A-Za-z0-9]+/g,"_") + "_" +
    hoy.getFullYear() + ("0"+(hoy.getMonth()+1)).slice(-2) + ("0"+hoy.getDate()).slice(-2) + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function cargarSesionArchivo(archivo){
  var lector = new FileReader();
  lector.onload = function(e){
    try{
      var d = JSON.parse(e.target.result);
      if(!d || !d.casos) throw new Error("el archivo no contiene una sesión válida");
      estado.casos = d.casos;
      estado.uf = d.uf || {};
      estado.region = d.region || estado.region;
      estado.modoFactores = d.modoFactores || "panel";
      estado.utm = d.utm || 0;
      if(d.componentes) estado.componentes = d.componentes;
      estado.costoFijoItem = d.costoFijoItem || "";
      estado.costoFijoMonto = d.costoFijoMonto || 0;
      estado.padron = d.padron || [];
      estado.padronArchivo = d.padronArchivo || "";
      estado.padronFecha = d.padronFecha || "";
      estado.fuentesValidas = d.fuentesValidas || [];
      estado.saldosCargados = !!d.saldosCargados;
      estado.nombreArchivo = d.nombreArchivo || archivo.name;
      if(d.res700) RES700 = d.res700;
      estado.mensajesCarga = ["Sesión retomada desde " + archivo.name +
        (d.guardado ? " (guardada el " + fechaLegible(d.guardado) + ")" : "") + "."];
      filtro = {fuente:"todas", comuna:"todas", texto:""};
      recalcular(); guardarLocal(); poblarFiltros(); render();
    }catch(err){ alert("No fue posible leer la sesión: " + err.message); }
  };
  lector.readAsText(archivo);
}

function poblarFiltros(){
  var selRegion = document.getElementById("filtroRegion");
  selRegion.innerHTML = "";

    var o = document.createElement("option");

  estado.casos.forEach(function(c){

    if(c.comuna && comunas.indexOf(c.comuna) === -1) comunas.push(c.comuna);

  var activo = !!estado.componentes[clave];
  return '<label class="componente' + (activo ? " activo" : "") + '">' +
    '<input type="checkbox" data-componente="' + clave + '"' + (activo ? " checked" : "") + ">" +

    {n:"1", ir:"datos", t:"Cargue el panel de casos en proceso, una vez al mes",
     d:'Queda como base de consulta y no entra al cálculo; no hay que volver a cargarlo en cada licitación. La columna de folio puede venir como <b>N°_expediente</b>. De aquí se toman:<ul class="campos">' + campos + "</ul>",
     e: listo(estado.padron.length > 0),
     extra: estado.padron.length ? fmt(estado.padron.length) + " expedientes" + (estado.padronFecha ? ", cargado el " + fechaLegible(estado.padronFecha) : "") : "sin panel cargado"},

     e: listo(hay && (estado.saldosCargados || conSaldo === estado.casos.length)),
     extra: hay ? fmt(estado.casos.length) + " casos, " + fmt(conSaldo) + " con saldo informado" : "sin casos seleccionados"},
    {n:"3", ir:"etapas", t:"Verifique los parámetros del cálculo",
     d:"La región se deduce de las comunas de los propios expedientes y la serie UF se toma de la hoja UF del panel. Revise las etapas que se valorizan en G y, si hace falta, los costos en H y la serie UF en I.",
     e: listo(u.dias > 0),

    {n:"4", ir:"alertas", t:"Revise las alertas de financiamiento",
     d:"La sección B marca los saldos mayores al valor pagado, los casos sin saldo, los expedientes de otra región y las diferencias que deben imputarse al subtítulo 22 o a convenio.",
     e: hay ? listo(true) : '<span class="tag-pill warn">pendiente</span>',

    {n:"5", ir:"detalle", t:"Exporte el resultado",
     d:"La sección D entrega el Excel con tres hojas: resumen por fuente de financiamiento, detalle por caso con su memoria de cálculo, y alertas.",
     e: listo(hay), extra: hay ? "disponible" : "—"}
  ];

  return '<div class="flujo">' +
    '<div class="flujo-titulo">Flujo de trabajo</div>' +
    pasos.map(function(p){
      return '<div class="paso' + (p.ir ? " clicable" : "") + '"' + (p.ir ? ' data-ir="' + p.ir + '"' : "") + '><div class="p-num">' + p.n + "</div>" +
        '<div class="p-cuerpo"><div class="p-cab"><h4>' + p.t + "</h4>" + p.e + "</div>" +
        "<p>" + p.d + "</p>" +
        '<div class="p-estado">' + p.extra + "</div></div></div>";

}

        '<button class="btn-download peligro" id="btnBorrarCasos"' + (estado.casos.length ? "" : " disabled") + ">Eliminar la planilla cargada</button>" +

    if(f) cargarSesionArchivo(f);
  });
  var btnBorrarCasos = document.getElementById("btnBorrarCasos");
  if(btnBorrarCasos) btnBorrarCasos.addEventListener("click", function(){

    borrarTodo();
  });
  document.getElementById("btnEjemplo").addEventListener("click", cargarEjemplo);
  Array.prototype.forEach.call(c.querySelectorAll("select[data-campo]"), function(sel){
    sel.addEventListener("change", function(){
      estado.mapeo[sel.getAttribute("data-campo")] = parseInt(sel.value, 10);
      reconstruirDesdeMapeo();

};

      '<div class="card-sub">Resuelvos 4° y 5° de la Res. Ex. N° 700</div>' +
      '<div class="fila">' +
        '<div class="campo" style="flex:1 1 320px"><label>Cómo se aplican</label><select class="campo-sel" id="selModo">' +

          '<option value="inicial"' + (estado.modoFactores==="inicial"?" selected":"") + '>Calcular 0,3 sobre costo inicial total</option>' +
        "</select></div>" +
      "</div>" +
      '<div class="note-card"><b>Superficie.</b> Factor de 0,3 sobre el costo inicial de pago para inmuebles urbanos o rurales con superficie igual o mayor a 10 hectáreas.<br>' +
      '<b>Acceso.</b> Factor de 0,3 para predios que requieran más de un día de visita, estén a más de 200 km de la Secretaría Regional Ministerial u Oficina Provincial, o exijan medios especiales de transporte. La resolución fija comuna por comuna qué casos califican.</div>' +

        "<summary>Comunas con factor de acceso según el resuelvo 5°</summary>" +

          '<div class="campo"><label>Región</label><select class="campo-sel" id="selRegionAcceso">' +

  Array.prototype.forEach.call(c.querySelectorAll("input[data-componente]"), function(chk){

      recalcular(); guardarLocal(); render();

    pintarListaAcceso(this.value);

};

/* Lista desplegable con las comunas y su factor de acceso. */
function pintarListaAcceso(region){
  var caja = document.getElementById("listaAcceso");

/* Descarga la serie diaria desde mindicador.cl (servicio externo). */
function actualizarUFDesdeInternet(){
  if(typeof fetch === "undefined"){ avisoUF("Este navegador no permite descargar datos. Ingrese el valor manualmente.", "alerta"); return; }
  var anios = {};
  estado.casos.forEach(function(c){ if(c.fecha) anios[c.fecha.slice(0,4)] = true; });
  anios[String(new Date().getFullYear())] = true;
  var lista = Object.keys(anios).sort();
  var boton = document.getElementById("btnUFInternet");
  if(boton) boton.disabled = true;
  avisoUF("Consultando la serie de UF de los años " + lista.join(", ") + "…", "");

  var nuevos = 0, corregidos = 0, fallidos = [];
  var cadena = Promise.resolve();
  lista.forEach(function(anio){
    cadena = cadena.then(function(){
      return fetch("https://mindicador.cl/api/uf/" + anio)
        .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(d){
          (d.serie || []).forEach(function(p){
            var clave = String(p.fecha).slice(0,10);
            var valor = aNumero(p.valor);
            if(!valor) return;
            if(estado.uf[clave] === undefined) nuevos++;
            else if(Math.abs(estado.uf[clave] - valor) > 0.001) corregidos++;
            estado.uf[clave] = valor;
          });
        })
        .catch(function(){ fallidos.push(anio); });
    });
  });
  cadena.then(function(){
    recalcular(); guardarLocal(); render();
    if(fallidos.length === lista.length){
      avisoUF("No fue posible obtener la serie. Puede deberse a falta de internet o a que la red institucional bloquea el servicio. Ingrese el valor manualmente, tomándolo de sii.cl, o cargue el archivo con la hoja UF actualizada.", "alerta");
    }else{
      avisoUF("Serie actualizada: <b>" + fmt(nuevos) + "</b> días nuevos y <b>" + fmt(corregidos) + "</b> valores corregidos." +
        (fallidos.length ? " No se pudo obtener: " + fallidos.join(", ") + "." : "") +
        " Fuente: mindicador.cl, servicio externo que replica la serie oficial; verifique el dato antes de usarlo en un acto administrativo.", "aviso");
    }
  });
}
