/* --- Escala de color y utilidades del mapa ------------------------ */
var ESCALA_COLOR = ["#DCE6F0","#A9C2DC","#6E96C0","#3D6D9E","#153F66"];

function colorPorMonto(monto, maximo){
  if(!maximo || !monto) return "#EEF1F5";
  var i = Math.min(ESCALA_COLOR.length-1, Math.floor(monto / maximo * ESCALA_COLOR.length));
  return ESCALA_COLOR[i];
}

/* Proyección equirectangular corregida por latitud, ajustada al marco. */
function armarProyeccion(minLon, maxLon, minLat, maxLat, ancho, alto){
  var latMedia = (minLat + maxLat) / 2 * Math.PI / 180;
  var cos = Math.cos(latMedia);
  var anchoGeo = (maxLon - minLon) * cos || 1;
  var altoGeo = (maxLat - minLat) || 1;
  var escala = Math.min(ancho / anchoGeo, alto / altoGeo) * 0.94;
  var despX = (ancho - anchoGeo*escala) / 2;
  var despY = (alto - altoGeo*escala) / 2;
  return function(lon, lat){
    return [Math.round((despX + (lon - minLon) * cos * escala)*10)/10,
            Math.round((despY + (maxLat - lat) * escala)*10)/10];
  };
}

/* --- Mapa a partir de la capa comunal incorporada ------------------ */
function mapaRegionHTML(porComuna, maximo){
  var comunasGeo = GEO_COMUNAS[estado.region];
  if(!comunasGeo || !comunasGeo.length) return null;

  var minLon=1e9, maxLon=-1e9, minLat=1e9, maxLat=-1e9;
  comunasGeo.forEach(function(c){
    c.g.forEach(function(r){
      for(var i=0;i<r.length;i+=2){
        if(r[i] < minLon) minLon = r[i];
        if(r[i] > maxLon) maxLon = r[i];
        if(r[i+1] < minLat) minLat = r[i+1];
        if(r[i+1] > maxLat) maxLat = r[i+1];
      }
    });
  });

  /* El marco se adapta a la forma de la región (Chile es angosto y largo). */
  var latMedia = (minLat+maxLat)/2 * Math.PI/180;
  var razon = ((maxLat-minLat) || 1) / (((maxLon-minLon)*Math.cos(latMedia)) || 1);
  var ancho = 560;
  var alto = Math.max(300, Math.min(1000, Math.round(ancho * razon)));
  var proj = armarProyeccion(minLon, maxLon, minLat, maxLat, ancho, alto);

  var indiceDatos = {};
  Object.keys(porComuna).forEach(function(k){ indiceDatos[normalizar(k)] = k; });

  var paths = "", etiquetas = "", conDatos = 0;
  comunasGeo.forEach(function(c){
    var nombreDatos = indiceDatos[normalizar(c.n)];
    var g = nombreDatos ? porComuna[nombreDatos] : null;
    if(g) conDatos++;
    var d = "", cx=0, cy=0, mayor=-1;
    c.g.forEach(function(r){
      var sub = "", puntos = r.length/2;
      var rminx=1e9, rmaxx=-1e9, rminy=1e9, rmaxy=-1e9;
      for(var i=0;i<r.length;i+=2){
        var p = proj(r[i], r[i+1]);
        sub += (i === 0 ? "M" : "L") + p[0] + " " + p[1];
        if(p[0]<rminx) rminx=p[0];
        if(p[0]>rmaxx) rmaxx=p[0];
        if(p[1]<rminy) rminy=p[1];
        if(p[1]>rmaxy) rmaxy=p[1];
      }
      d += sub + "Z";
      if(puntos > mayor){ mayor = puntos; cx = (rminx+rmaxx)/2; cy = (rminy+rmaxy)/2; }
    });
    if(!d) return;
    var sel = nombreDatos && filtro.comuna === nombreDatos;
    paths += '<path d="' + d + '" fill-rule="evenodd" fill="' + (g ? colorPorMonto(g.valorizacion, maximo) : "#F1F3F6") +
      '" stroke="' + (sel ? "#C8102E" : "#FFFFFF") + '" stroke-width="' + (sel ? 2.2 : 0.7) + '"' +
      (g ? ' class="comuna-path" data-comuna="' + escapar(nombreDatos) + '"' : ' class="comuna-vacia"') + ">" +
      "<title>" + escapar(c.n) + (g ? ": " + fmtCLP(g.valorizacion) + " · " + g.casos + " casos" : ": sin casos en este cálculo") + "</title></path>";
    if(g){
      var oscuro = (g.valorizacion / maximo) > 0.55;
      etiquetas += '<text x="' + cx + '" y="' + cy + '" class="etq' + (oscuro ? " clara" : "") + '">' + escapar(c.n) + "</text>";
    }
  });

  return {
    svg: '<svg id="svgMapa" viewBox="0 0 ' + ancho + " " + alto + '" data-vb="0 0 ' + ancho + " " + alto +
         '" class="mapa-svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa comunal de la región ' + estado.region + '">' +
         paths + etiquetas + "</svg>",
    conDatos: conDatos,
    totalComunas: comunasGeo.length
  };
}

/* Mapa desde una capa GeoJSON cargada por el usuario (opcional). */
function mapaGeoCargadoHTML(porComuna, maximo){
  var indice = {};
  Object.keys(porComuna).forEach(function(k){ indice[normalizar(k)] = k; });
  var utiles = [];
  (estado.geo.features || []).forEach(function(f){
    var props = f.properties || {}, nombre = null;
    for(var k in props){
      if(typeof props[k] === "string" && indice[normalizar(props[k])]){ nombre = indice[normalizar(props[k])]; break; }
    }
    if(nombre && f.geometry) utiles.push({nombre:nombre, geometry:f.geometry});
  });
  if(!utiles.length) return null;

  var minLon=1e9, maxLon=-1e9, minLat=1e9, maxLat=-1e9;
  function recorrer(co, prof){
    if(prof === 0){
      if(co[0] < minLon) minLon = co[0];
      if(co[0] > maxLon) maxLon = co[0];
      if(co[1] < minLat) minLat = co[1];
      if(co[1] > maxLat) maxLat = co[1];
      return;
    }
    for(var i=0;i<co.length;i++) recorrer(co[i], prof-1);
  }
  utiles.forEach(function(u){
    if(u.geometry.type === "Polygon") recorrer(u.geometry.coordinates, 2);
    else if(u.geometry.type === "MultiPolygon") recorrer(u.geometry.coordinates, 3);
  });
  var latMedia = (minLat+maxLat)/2*Math.PI/180;
  var razon = ((maxLat-minLat)||1) / (((maxLon-minLon)*Math.cos(latMedia))||1);
  var ancho = 560, alto = Math.max(300, Math.min(1000, Math.round(ancho*razon)));
  var proj = armarProyeccion(minLon, maxLon, minLat, maxLat, ancho, alto);

  function anillo(a){
    var d = "";
    for(var i=0;i<a.length;i++){ var p = proj(a[i][0], a[i][1]); d += (i===0?"M":"L") + p[0] + " " + p[1]; }
    return d + "Z";
  }
  var svg = '<svg id="svgMapa" viewBox="0 0 ' + ancho + " " + alto + '" data-vb="0 0 ' + ancho + " " + alto +
    '" class="mapa-svg" preserveAspectRatio="xMidYMid meet">';
  utiles.forEach(function(u){
    var g = porComuna[u.nombre], d = "";
    if(u.geometry.type === "Polygon") u.geometry.coordinates.forEach(function(a){ d += anillo(a); });
    else u.geometry.coordinates.forEach(function(p){ p.forEach(function(a){ d += anillo(a); }); });
    if(!d) return;
    var sel = filtro.comuna === u.nombre;
    svg += '<path d="' + d + '" fill-rule="evenodd" fill="' + colorPorMonto(g.valorizacion, maximo) +
      '" stroke="' + (sel?"#C8102E":"#FFFFFF") + '" stroke-width="' + (sel?2.2:0.7) + '" class="comuna-path" data-comuna="' + escapar(u.nombre) + '">' +
      "<title>" + escapar(u.nombre) + ": " + fmtCLP(g.valorizacion) + "</title></path>";
  });
  return {svg: svg + "</svg>", conDatos: utiles.length, totalComunas: utiles.length};
}

/* Mosaico esquemático: último recurso si no hay geometría disponible. */
function mosaicoHTML(porComuna, comunas, maximo){

/* Conecta el clic del mapa o del mosaico con el filtro comunal. */

/* Conecta cualquier control con data-idx y data-campo al caso correspondiente.
   data-tipo indica cómo interpretar el valor: numero, texto o fecha. */
function conectarEdicionCasos(contenedor){
  Array.prototype.forEach.call(contenedor.querySelectorAll("[data-idx][data-campo]"), function(ctrl){
    var tipoCtrl = ctrl.getAttribute("data-tipo") || "numero";
    /* En los campos de fecha se espera a que el usuario termine de escribir:
       el calendario emite cambios parciales mientras se digita el año. */
    ctrl.addEventListener("change", function(){
      var caso = estado.casos[parseInt(ctrl.getAttribute("data-idx"), 10)];
      if(!caso) return;
      var campo = ctrl.getAttribute("data-campo");
      var tipo = tipoCtrl;
      var previo = caso[campo];
      if(tipo === "fecha" && (!ctrl.value || !aFecha(ctrl.value))) return;
      if(tipo === "fecha" && claveFecha(ctrl.value) === caso[campo]) return;
      registrarCambio("cambio de " + campo + " en el folio " + caso.folio,
        function(){ caso[campo] = previo; });
      if(tipo === "pesos") caso[campo] = aPesos(ctrl.value);
      else if(tipo === "numero") caso[campo] = Math.round(aNumero(ctrl.value));
      else if(tipo === "check") caso[campo] = ctrl.checked;
      else if(tipo === "fecha") caso[campo] = claveFecha(ctrl.value);
      else caso[campo] = String(ctrl.value).trim();
      calcularCaso(caso);
      guardarLocal();
      poblarFiltros();
      render();
    });
  });
}

/* Opciones de fuente de financiamiento: las del archivo más las ya presentes. */
function opcionesFuente(actual){
  var lista = (estado.fuentesValidas || []).slice();
  estado.casos.forEach(function(x){ if(x.fuente && lista.indexOf(x.fuente) === -1) lista.push(x.fuente); });
  if(actual && lista.indexOf(actual) === -1) lista.push(actual);
  lista.sort();
  return '<option value="">— sin fuente —</option>' + lista.map(function(f){
    return '<option value="' + escapar(f) + '"' + (f === actual ? " selected" : "") + ">" + escapar(f) + "</option>";
  }).join("");
}

];

function alertasCaso(c){
  var a = [];
  /* En convenio y sectorial el saldo SIGFE no financia el caso, de modo que
     no se revisa: las alertas de saldo se aplican solo cuando paga el solicitante. */
  if(!c.sinAporteTercero){
    var saldoSobrePago = (c.costoAPagar > 0 && c.saldoSigfe > c.costoAPagar);
    if(saldoSobrePago && c.valorizacion > 0 && c.costoAPagar < c.valorizacion) a.push("pago_insuficiente");
    else if(saldoSobrePago) a.push("sigfe_mayor_pago");
    if(c.saldoSigfe === 0) a.push("sin_saldo");
  }
  if(!c.fuente) a.push("sin_fuente");
  if(normalizar(c.fuente).indexOf("CONVENIO") > -1 && !String(c.convenioNombre || "").trim()) a.push("convenio_sin_nombre");
  if(!c.acceso && c.comuna && accesoDeComuna(c.comuna) === true) a.push("acceso_no_registrado");
  if(c.sinUF) a.push("sin_uf");
  var regCom = regionDeComuna(c.comuna);
  if(regCom && regCom !== estado.region) a.push("comuna_otra_region");
  if(c.montoCaso > 0 && c.valorizacion > c.montoCaso) a.push("valor_sobre_monto_caso");
  if(estado.componentes.fijo && c.topeCostoFijo && c.costoFijo > c.topeCostoFijo) a.push("costo_fijo_sobre_tope");
  return a;
}
/* Una alerta con visto bueno queda registrada pero deja de contar como pendiente. */
function alertaAceptada(c, id){
  return !!(c.alertasOk && c.alertasOk.indexOf(id) > -1);
}
function alertasPendientes(c){
  return (c.alertas || []).filter(function(id){ return !alertaAceptada(c, id); });
}
function alternarVistoBueno(caso, id){
  if(!tipoAlerta(id).aceptable) return;
  var previo = (caso.alertasOk || []).slice();
  registrarCambio("visto bueno de " + tipoAlerta(id).titulo + " en el folio " + caso.folio,
    function(){ caso.alertasOk = previo; });
  if(!caso.alertasOk) caso.alertasOk = [];
  var i = caso.alertasOk.indexOf(id);
  if(i > -1) caso.alertasOk.splice(i, 1); else caso.alertasOk.push(id);
  guardarLocal(); render();
}

function tipoAlerta(id){
  for(var i=0;i<TIPOS_ALERTA.length;i++) if(TIPOS_ALERTA[i].id === id) return TIPOS_ALERTA[i];
  return {id:id, nivel:"media", titulo:id, detalle:""};
}
/* Monto involucrado en cada tipo de alerta. */
function montoAlerta(id, c){
  if(id === "sigfe_mayor_pago") return Math.max(0, c.saldoSigfe - c.costoAPagar);
  if(id === "pago_insuficiente") return Math.max(0, c.valorizacion - c.costoAPagar);
  if(id === "sin_saldo") return c.f41;
  if(id === "valor_sobre_monto_caso") return Math.max(0, c.valorizacion - c.montoCaso);
  if(id === "costo_fijo_sobre_tope") return Math.max(0, c.costoFijo - c.topeCostoFijo);
  if(id === "acceso_no_registrado")
    return Math.round(0.3 * ((estado.modoFactores === "inicial" ? c.costoInicial : c.etapa) || 0));
  return c.valorizacion;
}

PANELES.alertas = function(c){
  var lista = casosFiltrados();
  if(!lista.length){ c.innerHTML = encabezadoPanel("B · Cálculo","Alertas de financiamiento","") + sinDatos("No hay casos que revisar."); return; }

  var porTipo = {}, aceptadas = 0;
  lista.forEach(function(caso){
    caso.alertas.forEach(function(id){
      if(alertaAceptada(caso, id)){ aceptadas++; return; }
      if(!porTipo[id]) porTipo[id] = {casos:[], monto:0};
      porTipo[id].casos.push(caso);
      porTipo[id].monto += montoAlerta(id, caso);
    });
  });
  var ids = TIPOS_ALERTA.map(function(t){ return t.id; }).filter(function(id){ return porTipo[id]; });
  var conAlerta = lista.filter(function(x){ return alertasPendientes(x).length; });
  var conVistoBueno = lista.filter(function(x){
    return x.alertas.length && !alertasPendientes(x).length;
  });
  var altas = lista.filter(function(x){
    return alertasPendientes(x).some(function(id){ return tipoAlerta(id).nivel === "alta"; });
  });
  /* Diferencia entre lo pagado por el solicitante y el valor unitario licitado. */
  var remanente = 0, conRemanente = 0;
  lista.forEach(function(x){
    var d = x.saldoSigfe - x.valorizacion;
    if(d > 0){ remanente += d; conRemanente++; }
  });

  if(!ids.length){
    c.innerHTML = encabezadoPanel("B · Cálculo","Alertas de financiamiento",
      "Revisión de las condiciones que pueden alterar la imputación de recursos antes de licitar.") +
      (estado.foliosSinPanel.length
        ? '<div class="note-card alerta"><b>' + fmt(estado.foliosSinPanel.length) +
          " folios de la lista no están en el panel y no forman parte de este cálculo.</b> Resuélvalos en la sección A antes de licitar.</div>"
        : "") +
      (lista.filter(function(x){ return x.alertas.length; }).length
        ? '<div class="note-card"><b>' + fmt(lista.filter(function(x){ return x.alertas.length; }).length) +
          " casos tuvieron alertas que quedaron con visto bueno.</b> Siguen registradas en el Excel con su marca de revisión.</div>"
        : "") +
      '<div class="note-card"><b>Sin alertas pendientes.</b> Los ' + fmt(lista.length) + " casos revisados tienen su financiamiento resuelto: saldo SIGFE donde corresponde, fuente declarada y UF disponible para la fecha de ingreso.</div>" +
      cartucho("B — Alertas de financiamiento");
    return;
  }

  var tarjetas = ids.map(function(id){
    var t = tipoAlerta(id), g = porTipo[id];
    return '<div class="alerta-card ' + t.nivel + '">' +
      '<div class="a-cab"><span class="tag-pill ' + (t.nivel === "alta" ? "bad" : "warn") + '">' + (t.nivel === "alta" ? "Revisión previa" : "Por completar") + "</span>" +
      '<span class="a-casos">' + fmt(g.casos.length) + (g.casos.length === 1 ? " caso" : " casos") + "</span></div>" +
      "<h4>" + t.titulo + "</h4>" +
      '<div class="a-monto">' + fmtCLP(g.monto) + "</div>" +

/* ---- Imputación de las diferencias entre valorización y monto del caso ---- */
var OPCIONES_REPARTO = [
  {v:"auto",     t:"Sin reasignar (según la fuente)"},
  {v:"f41",      t:"Subtítulo 22 / Fondo 41"},
  {v:"convenio", t:"Convenio"},
  {v:"mixto",    t:"Repartir entre ambos"}
];

function tarjetaReparto(lista){
  var afectados = lista.filter(function(x){ return x.diferencia > 0; });
  if(!afectados.length) return "";

  var totalDif = 0, total22 = 0, totalConv = 0, sinDecidir = 0;
  afectados.forEach(function(x){
    totalDif += x.diferencia; total22 += x.difAl22; totalConv += x.difAConvenio;
    if(!x.repartoDif || x.repartoDif === "auto") sinDecidir++;
  });

  var filas = afectados.map(function(x){
    var idx = estado.casos.indexOf(x);
    var actual = x.repartoDif || "auto";
    var opciones = OPCIONES_REPARTO.map(function(o){
      return '<option value="' + o.v + '"' + (actual === o.v ? " selected" : "") + ">" + o.t + "</option>";
    }).join("");
    return "<td>" + escapar(x.folio) + "</td>" +
      "<td>" + escapar(x.comuna) + "</td>" +
      "<td>" + escapar(x.fuente || "—") + "</td>" +
      '<td class="num">' + fmt(x.valorizacion) + "</td>" +
      '<td class="num">' + fmt(x.montoCaso) + "</td>" +
      '<td class="num calc">' + fmt(x.diferencia) + "</td>" +
      '<td class="edit"><select class="campo-sel sel-reparto" data-idx="' + idx + '">' + opciones + "</select></td>" +
      '<td class="num edit"><input type="number" min="0" max="100" step="5" class="pct-reparto" data-idx="' + idx + '" value="' +
        (x.pctAl22 === undefined ? 50 : x.pctAl22) + '"' + (actual === "mixto" ? "" : " disabled") + "></td>" +
      '<td class="num">' + (x.difImputada ? fmt(x.difAl22) : "—") + "</td>" +
      '<td class="num">' + (x.difImputada ? fmt(x.difAConvenio) : "—") + "</td>";
  });
  var totalFila = '<td colspan="5">TOTAL · ' + afectados.length + (afectados.length === 1 ? " caso" : " casos") + "</td>" +
    '<td class="num calc">' + fmt(totalDif) + '</td><td colspan="2"></td>' +
    '<td class="num">' + fmt(total22) + '</td><td class="num">' + fmt(totalConv) + "</td>";

  var opcionesMasivas = OPCIONES_REPARTO.map(function(o){ return '<option value="' + o.v + '">' + o.t + "</option>"; }).join("");

  return '<div class="card"><h3>Imputación de las diferencias</h3>' +
    '<div class="card-sub">' + afectados.length + (afectados.length === 1 ? " caso donde el valor unitario supera el monto registrado" : " casos donde el valor unitario supera el monto registrado") +
      " · " + fmtCLP(totalDif) + " por imputar</div>" +
    '<div class="note-card">Elija a qué fuente se carga la diferencia de cada caso. <b>Sin reasignar</b> mantiene la regla de la planilla, que imputa según la fuente de financiamiento del expediente. La reasignación solo puede mover la parte con cargo fiscal: lo cubierto por el saldo SIGFE del solicitante se mantiene como aporte de terceros.' +
      (sinDecidir ? " Quedan <b>" + sinDecidir + "</b> casos sin decisión tomada." : "") + "</div>" +
    '<div class="fila">' +
      '<div class="campo"><label>Aplicar a todos los casos</label><select class="campo-sel" id="repartoMasivo">' + opcionesMasivas + "</select></div>" +
      '<div class="campo"><label>% al subtítulo 22 si reparte</label><input type="number" min="0" max="100" step="5" id="pctMasivo" value="50"></div>' +
      '<button class="btn-download claro" id="btnRepartoMasivo">Aplicar</button>' +
    "</div>" +
    tablaHTML(["Folio","Comuna","Fuente","Valorización","Monto caso","Diferencia","Imputación","% al 22","Al 22 / Fondo 41","A convenio"], filas, totalFila) +
    "</div>";
}

function conectarReparto(contenedor){
  Array.prototype.forEach.call(contenedor.querySelectorAll(".sel-reparto"), function(sel){
    sel.addEventListener("change", function(){
      var caso = estado.casos[parseInt(sel.getAttribute("data-idx"),10)];
      var previo = caso.repartoDif;
      registrarCambio("imputación de la diferencia del folio " + caso.folio,
        function(){ caso.repartoDif = previo; calcularCaso(caso); });
      caso.repartoDif = sel.value;
      calcularCaso(caso); guardarLocal(); render();
    });
  });
  Array.prototype.forEach.call(contenedor.querySelectorAll(".pct-reparto"), function(inp){
    inp.addEventListener("change", function(){
      var caso = estado.casos[parseInt(inp.getAttribute("data-idx"),10)];
      var previo = caso.pctAl22;
      registrarCambio("porcentaje al 22 del folio " + caso.folio,
        function(){ caso.pctAl22 = previo; calcularCaso(caso); });
      caso.pctAl22 = Math.min(100, Math.max(0, aNumero(inp.value)));
      calcularCaso(caso); guardarLocal(); render();
    });
  });
  var btn = document.getElementById("btnRepartoMasivo");
  if(btn) btn.addEventListener("click", function(){
    var modo = document.getElementById("repartoMasivo").value;
    var pct = Math.min(100, Math.max(0, aNumero(document.getElementById("pctMasivo").value)));
    var previos = estado.casos.map(function(x){ return {r:x.repartoDif, p:x.pctAl22}; });
    registrarCambio("imputación masiva de las diferencias", function(){
      estado.casos.forEach(function(x,i){ x.repartoDif = previos[i].r; x.pctAl22 = previos[i].p; calcularCaso(x); });
    });
    estado.casos.forEach(function(x){
      if(x.diferencia > 0){ x.repartoDif = modo; x.pctAl22 = pct; calcularCaso(x); }
    });
    guardarLocal(); render();
  });
}

/* Zoom y desplazamiento del mapa: se mueve la ventana (viewBox) del SVG,
   de modo que el dibujo se mantiene nítido en cualquier acercamiento. */
function activarZoomMapa(){
  var svg = document.getElementById("svgMapa");
  if(!svg) return;
  var encuadre = svg.getAttribute("data-vb") || svg.getAttribute("viewBox");
  if(!encuadre) return;
  var inicial = encuadre.split(" ").map(Number);
  var vista = inicial.slice();

  function aplicar(){ svg.setAttribute("viewBox", vista.join(" ")); }
  function escalar(factor, focoX, focoY){
    var nuevoAncho = vista[2] * factor, nuevoAlto = vista[3] * factor;
    /* Entre un cuarto y cuatro veces el encuadre original. */
    if(nuevoAncho < inicial[2]*0.22 || nuevoAncho > inicial[2]*4) return;
    var fx = (focoX === undefined) ? vista[0] + vista[2]/2 : focoX;
    var fy = (focoY === undefined) ? vista[1] + vista[3]/2 : focoY;
    vista[0] = fx - (fx - vista[0]) * factor;
    vista[1] = fy - (fy - vista[1]) * factor;
    vista[2] = nuevoAncho; vista[3] = nuevoAlto;
    aplicar();
  }
  /* Convierte coordenadas de pantalla a unidades del mapa. */
  function aMapa(ev){
    var caja = svg.getBoundingClientRect();
    var escalaVista = Math.max(vista[2]/caja.width, vista[3]/caja.height);   // preserveAspectRatio meet
    var anchoDibujo = vista[2]/escalaVista, altoDibujo = vista[3]/escalaVista;
    var margenX = (caja.width - anchoDibujo)/2, margenY = (caja.height - altoDibujo)/2;
    return {x: vista[0] + (ev.clientX - caja.left - margenX) * escalaVista,
            y: vista[1] + (ev.clientY - caja.top - margenY) * escalaVista,
            k: escalaVista};
  }

  var mas = document.getElementById("mapaMas");
  var menos = document.getElementById("mapaMenos");
  var reset = document.getElementById("mapaReset");
  if(mas) mas.addEventListener("click", function(){ escalar(1/1.35); });
  if(menos) menos.addEventListener("click", function(){ escalar(1.35); });
  if(reset) reset.addEventListener("click", function(){ vista = inicial.slice(); aplicar(); });

  svg.addEventListener("wheel", function(ev){
    ev.preventDefault();
    var p = aMapa(ev);
    escalar(ev.deltaY < 0 ? 1/1.18 : 1.18, p.x, p.y);
  }, {passive:false});

  /* Arrastre: si el puntero no se movió, el clic sobre la comuna sigue filtrando. */
  var arrastrando = false, desdeX = 0, desdeY = 0, movido = 0, k = 1;
  svg.addEventListener("mousedown", function(ev){
    arrastrando = true; movido = 0;
    var p = aMapa(ev);
    k = p.k; desdeX = ev.clientX; desdeY = ev.clientY;
    svg.classList.add("arrastrando");
  });
  window.addEventListener("mousemove", function(ev){
    if(!arrastrando) return;
    var dx = ev.clientX - desdeX, dy = ev.clientY - desdeY;
    movido += Math.abs(dx) + Math.abs(dy);
    vista[0] -= dx * k; vista[1] -= dy * k;
    desdeX = ev.clientX; desdeY = ev.clientY;
    aplicar();
  });
  window.addEventListener("mouseup", function(){
    if(!arrastrando) return;
    arrastrando = false;
    svg.classList.remove("arrastrando");
  });
  /* Un arrastre no debe interpretarse como clic sobre la comuna. */
  svg.addEventListener("click", function(ev){
    if(movido > 6){ ev.stopPropagation(); movido = 0; }
  }, true);
}

/* --- F · Relato territorial --------------------------------------- */
PANELES.relato = function(c){
  var listaMapa = estado.casos.filter(function(x){
    return filtro.fuente === "todas" || x.fuente === filtro.fuente;
  });
  if(!listaMapa.length){ c.innerHTML = encabezadoPanel("F · Análisis","Relato territorial","") + sinDatos("No hay casos que relatar."); return; }

  var t = totales(listaMapa);
  var porComuna = agrupar(listaMapa, function(x){ return x.comuna || "(sin comuna)"; });
  var comunas = Object.keys(porComuna).sort(function(a,b){ return porComuna[b].valorizacion - porComuna[a].valorizacion; });
  var maximo = porComuna[comunas[0]].valorizacion;

  var top3 = comunas.slice(0,3);
  var montoTop3 = top3.reduce(function(s,k){ return s + porComuna[k].valorizacion; }, 0);
  var acumulado = 0, comunas80 = 0;
  comunas.forEach(function(k){ if(acumulado < t.valorizacion*0.8){ acumulado += porComuna[k].valorizacion; comunas80++; } });

  var perfil = comunas.map(function(k){
    var g = porComuna[k];
    return {comuna:k, casos:g.casos, monto:g.valorizacion, fiscal:g.f41 + g.convenio,
            prom: g.casos ? g.valorizacion/g.casos : 0};
  });
  var masCaro = perfil.slice().sort(function(a,b){ return b.prom - a.prom; })[0];
  var masBarato = perfil.slice().sort(function(a,b){ return a.prom - b.prom; })[0];
  var masCasos = perfil.slice().sort(function(a,b){ return b.casos - a.casos; })[0];
  var mayorCargaFiscal = perfil.slice().sort(function(a,b){ return (b.fiscal/(b.monto||1)) - (a.fiscal/(a.monto||1)); })[0];
  var brecha = masBarato.prom ? Math.round(masCaro.prom/masBarato.prom*10)/10 : 0;

  var geoRegion = GEO_COMUNAS[estado.region] || [];
  var sinCasos = geoRegion.length ? geoRegion.length - comunas.filter(function(k){
    return geoRegion.some(function(g){ return normalizar(g.n) === normalizar(k); });
  }).length : 0;

  var conAcceso = comunas.filter(function(k){ return accesoDeComuna(k) === true; });
  var montoConAcceso = conAcceso.reduce(function(s,k){ return s + porComuna[k].valorizacion; }, 0);
  var accesoAplicado = listaMapa.filter(function(x){ return x.acceso > 0; }).length;
  var conSuperficie = listaMapa.filter(function(x){ return x.superficie > 0; }).length;
  var montoSuperficie = listaMapa.reduce(function(s,x){ return s + x.superficie; }, 0);
  var ufMin = null, ufMax = null;
  listaMapa.forEach(function(x){
    if(!x.ufDia) return;
    if(ufMin === null || x.ufDia < ufMin) ufMin = x.ufDia;
    if(ufMax === null || x.ufDia > ufMax) ufMax = x.ufDia;
  });

  var lede = "Los " + fmtCLP(t.valorizacion) + " a licitar en la región " + estado.region +
    " se reparten entre " + comunas.length + " comunas, pero no de forma pareja: <b>" + top3.join(", ") +
    "</b> concentran " + pct(montoTop3, t.valorizacion) + " del total. " +
    (comunas80 === 1 ? "Una sola comuna explica el 80% del monto."
                     : "Bastan " + comunas80 + " comunas para llegar al 80%.") +
    (sinCasos > 0 ? " Otras " + sinCasos + " comunas de la región no registran casos en este cálculo." : "");

  var acum = 0;
  var serieAcum = comunas.map(function(k){ acum += porComuna[k].valorizacion; return Math.round(acum/t.valorizacion*1000)/10; });
  var top = comunas.slice(0,14);

  c.innerHTML =
    encabezadoPanel("F · Análisis", "Relato territorial",
      "Qué explica la distribución del monto entre comunas y qué conviene mirar antes de licitar.") +
    '<div class="lede">' + lede + "</div>" +

    '<div class="card"><h3>1 · Volumen o valor unitario</h3>' +
      '<div class="card-sub">El monto de una comuna depende de cuántos expedientes aporta y de cuánto vale cada uno</div>' +
      '<div class="note-card">' + escapar(masCasos.comuna) + " aporta la mayor cantidad de expedientes (" + masCasos.casos +
        " casos, " + fmtCLP(masCasos.monto) + "). El valor unitario más alto está en " + escapar(masCaro.comuna) + " con " +
        fmtCLP(masCaro.prom) + " por caso, frente a " + fmtCLP(masBarato.prom) + " en " + escapar(masBarato.comuna) +
        (brecha > 1 ? ": una brecha de " + String(brecha).replace(".",",") + " veces" : "") +
        ". La etapa técnica es idéntica para toda la región, así que la diferencia sale de los otros dos componentes del valor unitario: la UF vigente al ingresar cada expediente y los factores de superficie y acceso.</div>" +
      '<div class="grid-2">' +
        '<div><div class="card-sub">Casos y valor promedio por comuna</div><div class="chart-wrap"><canvas id="chDispersion"></canvas></div></div>' +
        '<div><div class="card-sub">Concentración acumulada del monto</div><div class="chart-wrap"><canvas id="chPareto"></canvas></div></div>' +
      "</div>" +
    "</div>" +

    '<div class="card"><h3>2 · Qué mueve el valor unitario</h3>' +
      '<div class="card-sub">Los tres componentes del cálculo, medidos sobre los casos incluidos</div>' +
      '<div class="kpi-row">' +
        '<div class="kpi"><div class="label">Etapa técnica</div><div class="num-display">' + fmtCLP(t.etapa) + '</div><div class="sub">' + pct(t.etapa, t.valorizacion) + " del monto · " + (RES700[estado.region].tecnica === null ? "sin etapa técnica" : fmtUF(RES700[estado.region].tecnica) + " UF por caso") + "</div></div>" +
        '<div class="kpi ambar"><div class="label">Factor superficie</div><div class="num-display">' + fmtCLP(montoSuperficie) + '</div><div class="sub">' + conSuperficie + " casos con predios de 10 ha o más</div></div>" +
        '<div class="kpi rojo"><div class="label">Factor acceso</div><div class="num-display">' + fmtCLP(t.acceso) + '</div><div class="sub">' + accesoAplicado + " casos con factor aplicado</div></div>" +
        '<div class="kpi verde"><div class="label">UF aplicada</div><div class="num-display" style="font-size:19px">' + (ufMin ? "$" + fmtUF(ufMin) + " – $" + fmtUF(ufMax) : "—") + '</div><div class="sub">rango entre las fechas de ingreso</div></div>' +
      "</div>" +
      '<div class="note-card">Cada solicitud se valoriza con la UF del día en que ingresó el expediente, no con la UF de hoy: dos casos idénticos ingresados con años de diferencia tienen montos distintos. ' +
        (ufMin && ufMax && ufMin !== ufMax ? "En este conjunto la UF varía entre $" + fmtUF(ufMin) + " y $" + fmtUF(ufMax) + ", una diferencia de " + pct(ufMax-ufMin, ufMin) + " sobre el componente técnico." : "") + "</div>" +
      (conAcceso.length ? '<div class="note-card aviso"><b>' + conAcceso.length + (conAcceso.length === 1 ? " comuna del cálculo figura" : " comunas del cálculo figuran") +
        " con factor de acceso en la Res. Ex. N° 700</b> (" + conAcceso.join(", ") + "), con " + fmtCLP(montoConAcceso) +
        " en juego. Hoy hay " + accesoAplicado + " casos con factor de acceso aplicado" +
        (accesoAplicado === 0 ? ": revise si corresponde incorporarlo antes de licitar." : ".") + "</div>" : "") +
    "</div>" +

    '<div class="card"><h3>3 · Quién paga en cada comuna</h3>' +
      '<div class="card-sub">Proporción financiada con fondos de solicitantes frente a la que queda con cargo fiscal</div>' +
      '<div class="note-card">A escala regional los solicitantes cubren ' + pct(t.tercero, t.valorizacion) + " del monto y " +
        pct(t.f41 + t.convenio, t.valorizacion) + " queda con cargo fiscal. La comuna con mayor carga fiscal relativa es <b>" +
        escapar(mayorCargaFiscal.comuna) + "</b>, donde " + pct(mayorCargaFiscal.fiscal, mayorCargaFiscal.monto) + " de sus " +
        fmtCLP(mayorCargaFiscal.monto) + " debe financiarse con el subtítulo 22, el Fondo 41 o convenios.</div>" +
      '<div class="chart-wrap"><canvas id="ch100"></canvas></div>' +
    "</div>" +
    cartucho("F — Relato territorial");

  graficos.dispersion = mkChart("chDispersion", {
    type:"bubble",
    data:{datasets:[{label:"Comunas",
      data:perfil.map(function(p){ return {x:p.casos, y:Math.round(p.prom), r:Math.max(5, Math.sqrt(p.monto/(maximo||1))*18), comuna:p.comuna}; }),
      backgroundColor:"rgba(21,63,102,.55)", borderColor:"#153F66"}]},
    options:{responsive:true, maintainAspectRatio:false,
      scales:{x:{title:{display:true, text:"Casos", font:{size:10,family:"Inter"}}, grid:{color:"#EEF0F3"}, ticks:{font:{size:10,family:"Inter"}}},
              y:{title:{display:true, text:"Promedio por caso", font:{size:10,family:"Inter"}}, grid:{color:"#EEF0F3"},
                 ticks:{font:{size:10,family:"Inter"}, callback:function(v){ return "$" + new Intl.NumberFormat('es-CL').format(v); }}}},
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:function(ctx){ var d = ctx.raw; return d.comuna + ": " + d.x + " casos · " + fmtCLP(d.y) + " por caso"; }}}}}
  });

  graficos.pareto = mkChart("chPareto", {
    data:{labels:comunas, datasets:[
      {type:"bar", label:"Monto", data:comunas.map(function(k){ return porComuna[k].valorizacion; }), backgroundColor:"#A9C2DC", borderRadius:3, yAxisID:"y"},
      {type:"line", label:"Acumulado", data:serieAcum, borderColor:"#C8102E", backgroundColor:"#C8102E", tension:.25, pointRadius:3, yAxisID:"y1"}
    ]},
    options:{responsive:true, maintainAspectRatio:false,
      scales:{x:{grid:{display:false}, ticks:{font:{size:9.5,family:"Inter"}}},
        y:{position:"left", grid:{color:"#EEF0F3"}, ticks:{font:{size:10,family:"Inter"}, callback:function(v){ return "$" + new Intl.NumberFormat('es-CL').format(v); }}},
        y1:{position:"right", min:0, max:100, grid:{display:false}, ticks:{font:{size:10,family:"Inter"}, callback:function(v){ return v + "%"; }}}},
      plugins:{legend:{position:"bottom", labels:{font:{size:10.5,family:"Inter"}, boxWidth:10}},
        tooltip:{callbacks:{label:function(ctx){
          return ctx.dataset.label === "Acumulado" ? "Acumulado: " + String(ctx.parsed.y).replace(".",",") + "%" : "Monto: " + fmtCLP(ctx.parsed.y); }}}}}
  });

  graficos.cien = mkChart("ch100", {
    type:"bar",
    data:{labels:top, datasets:[
      {label:"Aporte de terceros", data:top.map(function(k){ var g=porComuna[k]; return g.valorizacion ? Math.round(g.tercero/g.valorizacion*1000)/10 : 0; }), backgroundColor:"#1F7A5C", borderRadius:3},
      {label:"Cargo fiscal", data:top.map(function(k){ var g=porComuna[k]; return g.valorizacion ? Math.round((g.f41+g.convenio)/g.valorizacion*1000)/10 : 0; }), backgroundColor:"#B9790A", borderRadius:3}

      scales:{x:{stacked:true, min:0, max:100, grid:{color:"#EEF0F3"}, ticks:{font:{size:10,family:"Inter"}, callback:function(v){ return v + "%"; }}},
              y:{stacked:true, grid:{display:false}, ticks:{font:{size:10,family:"Inter"}}}},
      plugins:{legend:{position:"bottom", labels:{font:{size:10.5,family:"Inter"}, boxWidth:10}},
        tooltip:{callbacks:{label:function(ctx){ return ctx.dataset.label + ": " + String(ctx.parsed.x).replace(".",",") + "%"; }}}}}
  });
};

/* Nombres de las macroetapas activas, en el orden en que se muestran. */
function etiquetasComponentes(){
  var e = [];
  if(estado.componentes.tecnica) e.push("etapa técnica");
  if(estado.componentes.publicacion) e.push("publicación");
  if(estado.componentes.fijo) e.push("costo fijo" + (estado.costoFijoItem ? " (" + estado.costoFijoItem + ")" : ""));
  if(estado.componentes.inscripcion) e.push("inscripción");
  return e;
}

      if(inp.getAttribute("data-tipo") === "texto"){

/* ==================================================================
   ESCRITURA DE EXCEL CON FORMATO
   SheetJS no escribe estilos de celda, así que el archivo se arma
   aquí: se generan los XML del libro y se empaquetan en un ZIP.
   El formato replica la planilla de remesas: encabezado en azul con
   texto blanco, bordes punteados y montos en pesos.
   ================================================================== */

/* --- CRC32, necesario para el ZIP --- */
var TABLA_CRC = (function(){
  var t = [], c, n, k;
  for(n=0;n<256;n++){
    c = n;
    for(k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  var c = 0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++) c = TABLA_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function aBytes(texto){
  if(typeof TextEncoder !== "undefined") return new TextEncoder().encode(texto);
  var out = [], i, c;
  for(i=0;i<texto.length;i++){
    c = texto.charCodeAt(i);
    if(c < 128) out.push(c);
    else if(c < 2048){ out.push(192|(c>>6), 128|(c&63)); }
    else { out.push(224|(c>>12), 128|((c>>6)&63), 128|(c&63)); }
  }
  return new Uint8Array(out);
}

/* Empaqueta los archivos en un ZIP sin compresión (método "stored"). */
function crearZip(archivos){
  var partes = [], central = [], desplazamiento = 0;
  function u16(v){ return [v & 255, (v>>8) & 255]; }
  function u32(v){ return [v & 255, (v>>8) & 255, (v>>16) & 255, (v>>24) & 255]; }

  archivos.forEach(function(a){
    var nombre = aBytes(a.nombre), datos = aBytes(a.contenido), suma = crc32(datos);
    var encabezado = [].concat([0x50,0x4b,0x03,0x04], u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(suma), u32(datos.length), u32(datos.length), u16(nombre.length), u16(0));
    partes.push(new Uint8Array(encabezado), nombre, datos);
    central.push({nombre:nombre, suma:suma, largo:datos.length, desp:desplazamiento});
    desplazamiento += encabezado.length + nombre.length + datos.length;
  });

  var dir = [], largoDir = 0;
  central.forEach(function(c){
    var e = [].concat([0x50,0x4b,0x01,0x02], u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(c.suma), u32(c.largo), u32(c.largo), u16(c.nombre.length),
      u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.desp));
    dir.push(new Uint8Array(e), c.nombre);
    largoDir += e.length + c.nombre.length;
  });
  var fin = new Uint8Array([].concat([0x50,0x4b,0x05,0x06], u16(0), u16(0),
    u16(central.length), u16(central.length), u32(largoDir), u32(desplazamiento), u16(0)));

  var total = desplazamiento + largoDir + fin.length, salida = new Uint8Array(total), pos = 0;
  partes.concat(dir).concat([fin]).forEach(function(p){ salida.set(p, pos); pos += p.length; });
  return salida;
}

function xmlEscapar(t){
  return String(t === null || t === undefined ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/\u0000-\u0008/g,"");
}
function letraColumna(n){            // 1 -> A, 27 -> AA
  var s = "";
  while(n > 0){ var r = (n-1) % 26; s = String.fromCharCode(65+r) + s; n = Math.floor((n-1)/26); }
  return s;
}

/* Convierte una hoja lógica en el XML de la planilla.
   hoja = {nombre, anchos:[{col,ancho}], filas:[[celda,...]], altoEncabezado}
   celda = null | {v, t:"n"|"s", s:estilo} */
function hojaXML(hoja){
  var cols = "";
  if(hoja.anchos && hoja.anchos.length){
    cols = "<cols>" + hoja.anchos.map(function(a){
      return '<col min="' + a.col + '" max="' + a.col + '" width="' + a.ancho + '" customWidth="1"/>';
    }).join("") + "</cols>";
  }
  var filas = hoja.filas.map(function(fila, i){
    var nFila = i + 1;
    var alto = (hoja.altos && hoja.altos[nFila]) ? ' ht="' + hoja.altos[nFila] + '" customHeight="1"' : "";
    var celdas = "";
    fila.forEach(function(celda, j){
      if(!celda) return;
      var ref = letraColumna(j+1) + nFila;
      var estilo = celda.s ? ' s="' + celda.s + '"' : "";
      if(celda.t === "n" && celda.v !== "" && celda.v !== null && isFinite(celda.v)){
        celdas += '<c r="' + ref + '"' + estilo + '><v>' + celda.v + "</v></c>";
      }else if(celda.v === "" || celda.v === null || celda.v === undefined){
        celdas += '<c r="' + ref + '"' + estilo + "/>";
      }else{
        celdas += '<c r="' + ref + '"' + estilo + ' t="inlineStr"><is><t xml:space="preserve">' +
          xmlEscapar(celda.v) + "</t></is></c>";
      }
    });
    return '<row r="' + nFila + '"' + alto + ">" + celdas + "</row>";
  }).join("");

  /* Rango de la hoja: algunos lectores lo exigen para abrir el archivo. */
  var maxCol = 1;
  hoja.filas.forEach(function(f){ if(f && f.length > maxCol) maxCol = f.length; });
  var rango = "A1:" + letraColumna(maxCol) + Math.max(1, hoja.filas.length);

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<dimension ref="' + rango + '"/>' +
    '<sheetViews><sheetView workbookViewId="0"/></sheetViews>' +
    '<sheetFormatPr defaultRowHeight="15"/>' +
    cols + "<sheetData>" + filas + "</sheetData></worksheet>";
}

/* Arma el libro completo y devuelve los bytes del archivo .xlsx */
function construirLibro(hojas){
  var tipos = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    hojas.map(function(h,i){
      return '<Override PartName="/xl/worksheets/sheet' + (i+1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    }).join("") +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    "</Types>";

  var relsRaiz = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    "</Relationships>";

  var libro = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
    hojas.map(function(h,i){
      return '<sheet name="' + xmlEscapar(h.nombre) + '" sheetId="' + (i+1) + '" r:id="rId' + (i+1) + '"/>';
    }).join("") + "</sheets></workbook>";

  var relsLibro = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    hojas.map(function(h,i){
      return '<Relationship Id="rId' + (i+1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i+1) + '.xml"/>';
    }).join("") +
    '<Relationship Id="rId' + (hojas.length+1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    "</Relationships>";

  var archivos = [
    {nombre:"[Content_Types].xml", contenido:tipos},
    {nombre:"_rels/.rels", contenido:relsRaiz},
    {nombre:"xl/workbook.xml", contenido:libro},
    {nombre:"xl/_rels/workbook.xml.rels", contenido:relsLibro},
    {nombre:"xl/styles.xml", contenido:ESTILOS_XML}
  ];
  hojas.forEach(function(h,i){
    archivos.push({nombre:"xl/worksheets/sheet" + (i+1) + ".xml", contenido:hojaXML(h)});
  });
  return crearZip(archivos);
}

    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var sello = hoy.getFullYear() + ("0"+(hoy.getMonth()+1)).slice(-2) + ("0"+hoy.getDate()).slice(-2);
    a.href = url;
    a.download = "Calculo_licitacion_" + estado.region.replace(/[^A-Za-z0-9]+/g,"_") + "_" + sello + ".xlsx";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }catch(err){
    alert("No fue posible generar el archivo: " + err.message);
  }
}

/* Marca el factor de acceso según la tabla de la resolución. */

  });

/* ------------------------------------------------------------------
   Historial: cada cambio registra cómo revertirse, de modo que
   una corrección equivocada no obligue a recargar el archivo.
   ------------------------------------------------------------------ */
var historial = [];
function registrarCambio(descripcion, revertir){
  historial.push({desc:descripcion, revertir:revertir});
  if(historial.length > 30) historial.shift();
}
function deshacer(){
  var h = historial.pop();
  if(!h) return;
  h.revertir();
  recalcular();
  guardarLocal();
  poblarFiltros();
  render();
  var caja = document.getElementById("guardado");
  if(caja) caja.textContent = "deshecho: " + h.desc;
}
/* Copia de los saldos actuales, para poder restaurarlos en bloque. */
function copiaSaldos(){
  return estado.casos.map(function(c){ return c.saldoSigfe; });
}
function restaurarSaldos(copia){
  estado.casos.forEach(function(c,i){ if(copia[i] !== undefined) c.saldoSigfe = copia[i]; });
}

   11. RENDER GENERAL

function actualizarTopbar(){
  var t = totales(casosFiltrados());
  document.getElementById("badgeTotal").textContent = fmtCLP(t.valorizacion);
  var partes = [estado.region];
  if(estado.nombreArchivo) partes.push(estado.nombreArchivo);
  partes.push(fmt(t.casos) + " casos");
  document.getElementById("topMeta").textContent = partes.join(" · ");
}
/* Antes de redibujar se anota dónde estaba el usuario: desplazamiento de
   la página, de cada tabla y el campo que tenía en edición. */
function capturarUI(){
  var activo = document.activeElement, foco = null;
  if(activo && (activo.tagName === "INPUT" || activo.tagName === "SELECT")){
    foco = {idx: activo.getAttribute("data-idx"), campo: activo.getAttribute("data-campo"),
            id: activo.id || "", uf: activo.getAttribute("data-uf"),
            region: activo.getAttribute("data-region"), comp: activo.getAttribute("data-componente")};
  }
  var tablas = [];
  Array.prototype.forEach.call(document.querySelectorAll(".table-scroll"), function(t){
    tablas.push({top:t.scrollTop, left:t.scrollLeft});
  });
  return {y: window.scrollY || window.pageYOffset || 0, tablas: tablas, foco: foco,
          seccion: seccionActual};
}
function restaurarUI(ui){
  if(!ui) return;
  var tablas = document.querySelectorAll(".table-scroll");
  if(ui.seccion === seccionActual){
    for(var i=0;i<tablas.length && i<ui.tablas.length;i++){
      tablas[i].scrollTop = ui.tablas[i].top;
      tablas[i].scrollLeft = ui.tablas[i].left;
    }
    window.scrollTo(0, ui.y);
  }
  var f = ui.foco;
  if(!f) return;
  var sel = null;
  if(f.idx !== null && f.idx !== undefined && f.campo) sel = '[data-idx="' + f.idx + '"][data-campo="' + f.campo + '"]';
  else if(f.uf) sel = '[data-uf="' + f.uf + '"]';
  else if(f.region && f.campo) sel = '[data-region="' + f.region + '"][data-campo="' + f.campo + '"]';
  else if(f.comp) sel = '[data-componente="' + f.comp + '"]';
  else if(f.id) sel = "#" + f.id;
  if(!sel) return;
  var nodo = document.querySelector(sel);
  if(nodo && nodo.focus){
    nodo.focus();
    if(nodo.setSelectionRange && nodo.type !== "date" && nodo.type !== "checkbox"){
      try{ nodo.setSelectionRange(nodo.value.length, nodo.value.length); }catch(e){}
    }
  }
}

function render(){
  var ui = capturarUI();
  var sec = SECCIONES.filter(function(s){ return s.id === seccionActual; })[0];
  document.getElementById("topTitle").textContent = sec.titulo;

  /* La barra lateral distingue las secciones que aún no tienen datos
     y muestra cuántos casos requieren revisión. */
  var hayDatos = estado.casos.length > 0;
  var conAlerta = hayDatos ? estado.casos.filter(function(x){ return alertasPendientes(x).length; }).length : 0;
  Array.prototype.forEach.call(document.querySelectorAll(".nav-item"), function(b){
    var id = b.getAttribute("data-id");
    b.classList.toggle("active", id === seccionActual);
    var requiereDatos = SIN_DATOS_OK.indexOf(id) === -1;
    b.classList.toggle("no-disponible", requiereDatos && !hayDatos);
    b.title = (requiereDatos && !hayDatos) ? "Disponible al cargar los datos del panel" : "";
    var badge = b.querySelector(".nav-badge");
    if(id === "alertas" && conAlerta){
      if(!badge){ badge = document.createElement("span"); badge.className = "nav-badge"; b.appendChild(badge); }
      badge.textContent = conAlerta;
    }else if(badge){ badge.parentNode.removeChild(badge); }
  });

  destruirGraficos();
  var c = document.getElementById("content");
  c.className = "content";
  PANELES[seccionActual](c);
  actualizarTopbar();

  var btnExp = document.getElementById("btnExportarTop");
  if(btnExp){
    btnExp.disabled = !hayDatos;
    btnExp.title = hayDatos ? "Exportar los " + fmt(estado.casos.length) + " casos a Excel" : "Cargue los casos a licitar";
  }
  var btnDes = document.getElementById("btnDeshacer");
  if(btnDes){
    btnDes.disabled = historial.length === 0;
    btnDes.title = historial.length ? "Deshacer: " + historial[historial.length-1].desc : "No hay cambios que deshacer";
  }
  mostrarGuardado();
  restaurarUI(ui);
}

document.getElementById("btnDeshacer").addEventListener("click", deshacer);
document.getElementById("btnExportarTop").addEventListener("click", exportarExcel);
document.addEventListener("keydown", function(ev){
  if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z" &&
     document.activeElement && document.activeElement.tagName !== "INPUT"){
    ev.preventDefault(); deshacer();
  }
});

/* Controles de la barra superior */
document.getElementById("filtroRegion").addEventListener("change", function(){
  var previo = estado.region, previoManual = estado.regionManual;
  registrarCambio("cambio de región a " + this.value, function(){
    estado.region = previo; estado.regionManual = previoManual;
  });
  estado.region = this.value;
  estado.regionManual = true;
  if(estado.modoFactores !== "panel") proponerAcceso();
  recalcular(); guardarLocal(); render();
});
document.getElementById("menuBtn").addEventListener("click", function(){

  document.getElementById("overlay").classList.toggle("show");
});
document.getElementById("overlay").addEventListener("click", function(){
  document.getElementById("sidebar").classList.remove("open");
  this.classList.remove("show");
});

render();
